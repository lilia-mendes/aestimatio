<script>
'use strict';
const STORE='atlas_sumativa_v1', LEGACY_STORE='atlas_'+'som'+'ativa_v1';
const uid=()=>crypto.randomUUID?crypto.randomUUID():'id_'+Date.now()+'_'+Math.random().toString(36).slice(2);
const empty=()=>({version:2,schoolYears:[],regimes:[],classes:[],students:[],periods:[],assessments:[],questions:[],grades:[],stars:[],settings:{yearMethod:'average',starMax:25,starBonus:1,clientId:'',spreadsheetId:'',driveFolderId:'',lastSync:''}});
let db;try{db=JSON.parse(localStorage.getItem(STORE)||localStorage.getItem(LEGACY_STORE))||empty()}catch{db=empty()};for(const k of ['schoolYears','regimes','classes','students','periods','assessments','questions','grades','stars'])if(!Array.isArray(db[k]))db[k]=[];db.settings={...empty().settings,...db.settings};
function migrateData(data){if(data.version>=2)return data;const old=JSON.stringify(data);try{localStorage.setItem('atlas_backup_pre_regimes_'+new Date().toISOString(),old)}catch(e){console.warn('Backup local indisponível',e)}const years=new Map(),regimes=new Map(),mapping=new Map();const yearFor=name=>{name=name||'2026/2027';if(!years.has(name)){const y={id:uid(),name,start:'',end:''};years.set(name,y);data.schoolYears.push(y)}return years.get(name)};for(const c of data.classes){const y=yearFor(c.schoolYear),oldPs=data.periods.filter(p=>p.classId===c.id).sort((a,b)=>a.order-b.order),type=oldPs.some(p=>/semestre/i.test(p.name))?'semestral':oldPs.some(p=>/trimestre|período|periodo/i.test(p.name))?'trimestral':oldPs.length===2?'semestral':oldPs.length===3?'trimestral':'personalizado';const signature=JSON.stringify(oldPs.map(p=>[p.order,p.name,p.start||'',p.end||'']));const key=y.id+'|'+type+'|'+signature;let regime=regimes.get(key);if(!regime){regime={id:uid(),schoolYearId:y.id,type,name:type==='semestral'?'Regime semestral':type==='trimestral'?'Regime trimestral':'Regime personalizado'};regimes.set(key,regime);data.regimes.push(regime);for(const p of oldPs){p.regimeId=regime.id;delete p.classId}}else{for(let i=0;i<oldPs.length;i++)mapping.set(oldPs[i].id,data.periods.find(p=>p.regimeId===regime.id&&p.order===oldPs[i].order&&p.name===oldPs[i].name).id)}c.schoolYearId=y.id;c.regimeId=regime.id;delete c.schoolYear}data.periods=data.periods.filter(p=>!mapping.has(p.id));for(const a of data.assessments)if(mapping.has(a.periodId))a.periodId=mapping.get(a.periodId);for(const e of data.stars)if(mapping.has(e.periodId))e.periodId=mapping.get(e.periodId);data.version=2;return data}
db=migrateData(db);
let view='dashboard',classId=db.classes[0]?.id||'',periodId='',assessmentId='',draftQuestions=[],modalSubmit=null,tokenClient=null,googleToken='',docItems=[];
const $=s=>document.querySelector(s), E=s=>document.getElementById(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n===null||n===undefined||Number.isNaN(n)?'—':Number(n).toLocaleString('pt-PT',{minimumFractionDigits:0,maximumFractionDigits:2});
const round=n=>Math.round((n+Number.EPSILON)*100)/100;
const by=(type,id)=>db[type].find(x=>x.id===id);
const inClass=(type)=>db[type].filter(x=>x.classId===classId);
const periods=()=>db.periods.filter(p=>p.regimeId===by('classes',classId)?.regimeId).sort((a,b)=>a.order-b.order);
const students=()=>inClass('students').sort((a,b)=>a.name.localeCompare(b.name,'pt'));
const assessments=(p=periodId)=>inClass('assessments').filter(a=>a.periodId===p).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
const questions=a=>db.questions.filter(q=>q.assessmentId===a).sort((x,y)=>x.order-y.order);
function save(){localStorage.setItem(STORE,JSON.stringify(db));E('saveState').textContent='Guardado às '+new Date().toLocaleTimeString('pt-PT');}
function toast(s,error=false){const n=E('toast'),dialog=E('modal');if(dialog?.open){if(n.parentNode!==dialog)dialog.appendChild(n)}else if(n.parentNode!==document.body)document.body.appendChild(n);n.textContent=s;n.className='toast'+(error?' error':'');n.setAttribute('role',error?'alert':'status');n.setAttribute('aria-live',error?'assertive':'polite');n.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>n.style.display='none',4200)}
E('modal').addEventListener('close',()=>{const n=E('toast');if(n.parentNode!==document.body)document.body.appendChild(n)});
function syncSelection(){if(!by('classes',classId))classId=db.classes[0]?.id||'';if(!periods().some(p=>p.id===periodId))periodId=periods()[0]?.id||'';if(!assessments().some(a=>a.id===assessmentId))assessmentId=assessments()[0]?.id||''}
function setClass(id){classId=id;periodId='';assessmentId='';render()}
function setPeriod(id){periodId=id;assessmentId='';render()}
function setView(v){view=v;render();if(window.matchMedia('(max-width:920px)').matches)closeSidebar()}
function syncSidebar(){const mobile=window.matchMedia('(max-width:920px)').matches,open=mobile?document.body.classList.contains('sidebar-open'):!document.body.classList.contains('sidebar-collapsed');for(const id of ['menuToggle','globalMenuToggle']){const button=E(id);if(button){button.setAttribute('aria-expanded',String(open));button.setAttribute('aria-label',open?'Fechar menu lateral':'Abrir menu lateral')}}}
function toggleSidebar(){document.body.classList.toggle(window.matchMedia('(max-width:920px)').matches?'sidebar-open':'sidebar-collapsed');syncSidebar()}
function closeSidebar(){document.body.classList.remove('sidebar-open');syncSidebar()}
window.addEventListener('resize',()=>{if(!window.matchMedia('(max-width:920px)').matches)closeSidebar();else syncSidebar()});
function meta(){const titles={dashboard:['Visão geral','Avaliação das turmas','Resultados, médias e indicadores num único local.'],classes:['Turmas','Gerir turmas','Associa as turmas ao ano letivo e regime de avaliação.'],students:['Alunos','Alunos da turma','Adiciona, edita ou remove alunos.'],assessments:['Avaliações','Testes e questões de aula','Define perguntas, cotações, domínios e pesos.'],grades:['Classificações','Grelha de classificação','Atribui pontuações por pergunta a cada aluno.'],stars:['Estrelas','Participação e comportamento','Regista estrelas por semestre ou período.'],reports:['Resultados','Resultados finais','Notas por domínio, avaliação, período e ano.'],schoolYears:['Ano letivo','Anos letivos e regimes','Configura regimes semestrais e trimestrais e os respetivos períodos.'],settings:['Definições','Configuração e sincronização','Regras globais, Google Sheets e cópias de segurança.']};const x=titles[view];E('crumb').textContent=x[0].toUpperCase();E('pageTitle').textContent=x[1];E('subtitle').textContent=x[2]}
function classPicker(){return `<div class="filters"><div class="field"><label>Turma</label><select onchange="setClass(this.value)">${db.classes.length?db.classes.map(c=>`<option value="${c.id}" ${c.id===classId?'selected':''}>${esc(c.name)}</option>`).join(''):'<option value="">Sem turmas</option>'}</select></div>${view!=='students'&&view!=='classes'&&view!=='schoolYears'&&view!=='settings'&&view!=='dashboard'?`<div class="field"><label>Período / semestre</label><select onchange="setPeriod(this.value)">${periods().length?periods().map(p=>`<option value="${p.id}" ${p.id===periodId?'selected':''}>${esc(p.name)}</option>`).join(''):'<option value="">Sem períodos</option>'}</select></div>`:''}</div>`}
function wrap(html){return db.classes.length?classPicker()+html:`<section class="panel empty"><h2>Começa pela tua primeira turma</h2><p>Configura primeiro o ano letivo e o regime, depois cria turmas e avaliações.</p><button class="btn primary" onclick="editClass()">+ Criar turma</button></section>`}
function render(){syncSelection();meta();const nav=[['dashboard','▦','Resumo'],['classes','▤','Turmas'],['schoolYears','▦','Anos letivos e regimes'],['students','♙','Alunos'],['assessments','▣','Avaliações'],['grades','▥','Classificar aluno'],['stars','★','Estrelas'],['reports','◫','Relatórios de avaliação'],['settings','⚙','Definições']];E('nav').innerHTML=nav.map(([id,ico,name])=>`<button class="${view===id?'active':''}" onclick="setView('${id}')"><span class="nav-icon" aria-hidden="true">${ico}</span><span class="nav-label">${name}</span></button>`).join('');const pages={dashboard:dashboardPage,classes:classesPage,schoolYears:schoolYearsPage,students:studentsPage,assessments:assessmentsPage,grades:gradesPage,stars:starsPage,reports:reportsPage,settings:settingsPage};E('content').innerHTML=pages[view]();}
function grade(a,s,q){return db.grades.find(g=>g.assessmentId===a&&g.studentId===s&&g.questionId===q)?.score??null}
function assessmentResult(a,s){const qs=questions(a.id),total=qs.reduce((t,q)=>t+Number(q.max),0);if(!qs.length||total<=0)return null;const vals=qs.map(q=>grade(a.id,s,q.id));if(vals.every(v=>v===null))return null;const obtained=qs.reduce((t,q,i)=>t+Number(vals[i]??0),0);return {earned:obtained,total,score200:round(obtained/total*200),score20:round(obtained/total*20),filled:vals.filter(v=>v!==null).length,full:vals.every(v=>v!==null)};}
function starCount(s,p){return db.stars.filter(e=>e.studentId===s&&e.periodId===p).reduce((n,e)=>n+Number(e.count||1),0)}
function bonus(s,p){return round(Math.min(starCount(s,p),Number(db.settings.starMax)||25)/(Number(db.settings.starMax)||25)*(Number(db.settings.starBonus)||0))}
function periodResult(s,p){const owner=by('students',s);const tests=db.assessments.filter(a=>a.classId===owner?.classId&&a.periodId===p).map(a=>({a,r:assessmentResult(a,s)})).filter(o=>o.r&&Number(o.a.weight)>0);if(!tests.length)return null;const w=tests.reduce((n,x)=>n+Number(x.a.weight),0);const base=tests.reduce((n,x)=>n+x.r.score20*Number(x.a.weight),0)/w;const b=bonus(s,p);return {base:round(base),bonus:b,total:round(Math.min(20,base+b)),count:tests.length}}
function annualResult(s){const c=by('classes',by('students',s)?.classId);const ps=db.periods.filter(p=>p.regimeId===c?.regimeId).sort((a,b)=>a.order-b.order),valid=ps.map(p=>periodResult(s,p.id)).filter(Boolean);if(!valid.length)return null;return db.settings.yearMethod==='last'?valid[valid.length-1].total:round(valid.reduce((n,x)=>n+x.total,0)/valid.length)}
function domainResult(a,s,d){const qs=questions(a).filter(q=>q.domain===d),max=qs.reduce((n,q)=>n+Number(q.max),0);if(!max)return null;const vals=qs.map(q=>grade(a,s,q.id));if(vals.every(v=>v===null))return null;return round(qs.reduce((n,q,i)=>n+Number(vals[i]??0),0)/max*100)}
function dashboardPage(){const c=by('classes',classId);return `<div class="layout"><div class="panel span3 stat"><label>Turmas</label><strong>${db.classes.length}</strong><span class="hint">Registadas</span></div><div class="panel span3 stat"><label>Alunos</label><strong>${db.students.length}</strong><span class="hint">Em todas as turmas</span></div><div class="panel span3 stat"><label>Avaliações</label><strong>${db.assessments.length}</strong><span class="hint">Testes e questões</span></div><div class="panel span3 stat"><label>Estrelas</label><strong>${db.stars.reduce((n,x)=>n+Number(x.count||1),0)}</strong><span class="hint">Registos acumulados</span></div><section class="panel span8"><div class="flex between"><h2>Panorama da turma</h2>${db.classes.length?`<select class="inline" style="width:auto" onchange="setClass(this.value)">${db.classes.map(x=>`<option value="${x.id}" ${x.id===classId?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:''}</div>${c?`<div class="tablewrap"><table><thead><tr><th>Aluno</th>${periods().map(p=>`<th class="num">${esc(p.name)}</th>`).join('')}<th class="num">Nota anual</th></tr></thead><tbody>${students().map(s=>`<tr><td>${esc(s.name)}</td>${periods().map(p=>`<td class="num">${fmt(periodResult(s.id,p.id)?.total)}</td>`).join('')}<td class="num"><strong>${fmt(annualResult(s.id))}</strong></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Ainda não existem alunos.</td></tr>'}</tbody></table></div>`:'<div class="empty">Adiciona a primeira turma para começar.</div>'}</section><section class="panel span4"><h2>Ações rápidas</h2><div class="stack"><button class="btn" onclick="editClass()">+ Nova turma</button><button class="btn" onclick="editStudent()">+ Novo aluno</button><button class="btn" onclick="setView('schoolYears')">⚙ Anos letivos e regimes</button><button class="btn primary" onclick="editAssessment()">+ Nova avaliação</button></div><div class="divider"></div><p class="help">Cada período é avaliado de forma independente. As estrelas acrescentam um bónus à nota do período, até ao máximo de 20 valores.</p></section></div>`}
function classesPage(){return `<div class="panel"><div class="flex between"><h2>Turmas (${db.classes.length})</h2><div class="flex"><button class="btn" onclick="setView('schoolYears')">Configurar anos letivos e períodos</button><button class="btn primary" onclick="editClass()">+ Nova turma</button></div></div><div class="tablewrap"><table><thead><tr><th>Turma</th><th>Ano letivo</th><th>Alunos</th><th>Regime de avaliação</th><th>Períodos</th><th>Avaliações</th><th></th></tr></thead><tbody>${db.classes.map(c=>`<tr><td><strong>${esc(c.name)}</strong></td><td>${esc(by('schoolYears',c.schoolYearId)?.name||'—')}</td><td>${db.students.filter(x=>x.classId===c.id).length}</td><td>${esc(by('regimes',c.regimeId)?.name||'—')}</td><td>${db.periods.filter(x=>x.regimeId===c.regimeId).length}</td><td>${db.assessments.filter(x=>x.classId===c.id).length}</td><td class="right"><button class="btn small" onclick="setClass('${c.id}');setView('students')">Abrir</button> <button class="btn small" onclick="editClass('${c.id}')">Editar</button> <button class="btn danger small" onclick="removeClass('${c.id}')">Remover</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Sem turmas.</td></tr>'}</tbody></table></div></div>`}
function studentsPage(){return wrap(`<section class="panel"><div class="flex between"><h2>Alunos (${students().length})</h2><button class="btn primary" onclick="editStudent()">+ Adicionar aluno</button></div><div class="tablewrap"><table><thead><tr><th>N.º</th><th>Nome</th><th>Identificador</th><th>Nota anual</th><th></th></tr></thead><tbody>${students().map(s=>`<tr><td>${esc(s.number||'—')}</td><td><strong>${esc(s.name)}</strong></td><td>${esc(s.code||'—')}</td><td>${fmt(annualResult(s.id))}</td><td class="right"><button class="btn small" onclick="editStudent('${s.id}')">Editar</button> <button class="btn danger small" onclick="removeStudent('${s.id}')">Remover</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Ainda não foram adicionados alunos.</td></tr>'}</tbody></table></div></section>`)}
function assessmentsPage(){return wrap(`<div class="panel"><div class="flex between"><h2>Avaliações de ${esc(by('periods',periodId)?.name||'—')}</h2><button class="btn primary" onclick="editAssessment()" ${!periodId?'disabled':''}>+ Nova avaliação</button></div><p class="hint">O peso é relativo às restantes avaliações do período; não é necessário que os pesos somem 100. Só avaliações com peso positivo entram na nota.</p><div class="tablewrap"><table><thead><tr><th>Nome</th><th>Tipo</th><th>Data</th><th>Perguntas</th><th>Cotação</th><th>Peso</th><th>Google Doc</th><th></th></tr></thead><tbody>${assessments().map(a=>{const qs=questions(a.id),sum=qs.reduce((n,q)=>n+Number(q.max),0);return `<tr><td><strong>${esc(a.name)}</strong></td><td><span class="chip ${a.type==='Questão de aula'?'gold':''}">${esc(a.type)}</span></td><td>${esc(a.date||'—')}</td><td>${qs.length}</td><td>${fmt(sum)} / 200</td><td>${fmt(a.weight)}</td><td>${a.docId?`<a class="link" href="https://docs.google.com/document/d/${encodeURIComponent(a.docId)}/edit" target="_blank" rel="noopener noreferrer">Abrir ↗</a>`:'—'}</td><td class="right"><button class="btn small" onclick="editAssessment('${a.id}')">Editar</button> <button class="btn small" onclick="assessmentId='${a.id}';setView('grades')">Corrigir</button> <button class="btn danger small" onclick="removeAssessment('${a.id}')">Remover</button></td></tr>`}).join('')||'<tr><td colspan="8" class="empty">Ainda não há avaliações neste período.</td></tr>'}</tbody></table></div></div>`)}
function gradesPage(){const a=by('assessments',assessmentId),qs=a?questions(a.id):[],domains=[...new Set(qs.map(q=>q.domain))];return wrap(`<section class="panel"><div class="flex between"><div><h2>Grelha de correção</h2><span class="hint">Os valores são guardados ao sair da célula. Usa Tab para avançar para a célula seguinte e Shift + Tab para voltar. Uma pergunta por preencher conta como zero quando existem outras respostas.</span></div><div class="flex"><select class="inline" style="min-width:240px" onchange="assessmentId=this.value;render()">${assessments().map(x=>`<option value="${x.id}" ${x.id===assessmentId?'selected':''}>${esc(x.name)} · ${esc(x.type)}</option>`).join('')||'<option>Sem avaliações</option>'}</select><button class="btn" onclick="if(assessmentId)editAssessment(assessmentId)" ${!a?'disabled':''}>Editar perguntas</button></div></div>${a&&qs.length?`<div class="note">${esc(a.name)} · cotação total: <strong>${fmt(qs.reduce((n,q)=>n+Number(q.max),0))}/200</strong>. A classificação final da prova é normalizada para 0–200 pontos e convertida em 0–20 valores.</div><div class="tablewrap"><table class="scoregrid"><thead><tr><th>Aluno</th>${qs.map(q=>`<th class="num"><span title="${esc(q.domain)}">${esc(q.name)}</span><div class="hint">${fmt(q.max)} pts</div></th>`).join('')}<th class="num">Pontos</th><th class="num">/ 200</th><th class="num">/ 20</th>${domains.map(d=>`<th class="num domainhead">${esc(d)} %</th>`).join('')}</tr></thead><tbody>${students().map(s=>{const r=assessmentResult(a,s.id);return `<tr><td><strong>${esc(s.name)}</strong><div class="hint">${esc(s.number||'')}</div></td>${qs.map(q=>`<td><input aria-label="${esc(s.name)} · ${esc(q.name)}" type="number" min="0" max="${q.max}" step="0.01" value="${grade(a.id,s.id,q.id)??''}" onchange="setGrade('${a.id}','${s.id}','${q.id}',this)" /></td>`).join('')}<td class="num">${fmt(r?.earned)}</td><td class="num"><strong>${fmt(r?.score200)}</strong></td><td class="num">${fmt(r?.score20)}</td>${domains.map(d=>`<td class="num">${fmt(domainResult(a.id,s.id,d))}%</td>`).join('')}</tr>`}).join('')||`<tr><td colspan="${qs.length+4+domains.length}" class="empty">Adiciona alunos à turma.</td></tr>`}</tbody></table></div>`:a?'<div class="empty">Esta avaliação ainda não tem perguntas. Edita a avaliação para adicionar perguntas e cotações.</div>':'<div class="empty">Cria uma avaliação para começar a corrigir.</div>'}</section>`)}
function starsPage(){const p=by('periods',periodId);return wrap(`<section class="panel"><div class="flex between"><h2>Estrelas de participação · ${esc(p?.name||'')}</h2><span class="chip gold">★ Máximo ${fmt(db.settings.starMax)} · bónus até +${fmt(db.settings.starBonus)} valores</span></div><p class="hint">Cada clique em +★ cria um registo independente, com data e hora. As estrelas contam apenas para este período. É possível desfazer o registo mais recente.</p><div class="tablewrap"><table><thead><tr><th>Aluno</th><th>Estrelas neste período</th><th>Progresso</th><th class="num">Bónus</th><th>Ações</th></tr></thead><tbody>${students().map(s=>{const count=starCount(s.id,periodId);return `<tr><td><strong>${esc(s.name)}</strong></td><td><span style="color:#e7a21d;font-size:19px">★</span> <strong>${count}</strong></td><td style="min-width:140px"><div class="progress"><div style="width:${Math.min(100,100*count/Math.max(1,db.settings.starMax))}%"></div></div></td><td class="num"><span class="badgeplus">+${fmt(bonus(s.id,periodId))}</span></td><td><button class="btn small primary" onclick="addStar('${s.id}')">+ ★</button> <button class="btn small" onclick="undoStar('${s.id}')" ${count===0?'disabled':''}>Desfazer</button></td></tr>`}).join('')||'<tr><td colspan="5" class="empty">Sem alunos.</td></tr>'}</tbody></table></div></section><div style="height:16px"></div><section class="panel"><h2>Histórico de estrelas</h2><div class="tablewrap"><table><thead><tr><th>Quando</th><th>Aluno</th><th>Período</th><th>Estrelas</th><th>Observação</th><th></th></tr></thead><tbody>${db.stars.filter(x=>x.classId===classId&&x.periodId===periodId).sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,100).map(x=>`<tr><td>${new Date(x.createdAt).toLocaleString('pt-PT')}</td><td>${esc(by('students',x.studentId)?.name||'[removido]')}</td><td>${esc(p?.name)}</td><td>${x.count}</td><td>${esc(x.note||'—')}</td><td><button class="btn danger small" onclick="removeStar('${x.id}')">Remover</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Sem registos neste período.</td></tr>'}</tbody></table></div></section>`)}
function reportsPage(){const p=by('periods',periodId),ass=assessments(),domains=[...new Set(ass.flatMap(a=>questions(a.id).map(q=>q.domain)))];return wrap(`<div class="tablist"><button class="on">Notas e domínios</button></div><section class="panel"><div class="flex between"><h2>${esc(p?.name||'—')} · resultados individuais</h2><button class="btn" onclick="exportExcel()">↓ Exportar relatório</button></div><p class="hint">A média ponderada considera as avaliações com classificação e peso positivo. O bónus é aplicado no final; a nota máxima é 20. A nota anual utiliza as notas finais de cada período com resultados.</p><div class="tablewrap"><table><thead><tr><th>Aluno</th>${ass.map(a=>`<th class="num">${esc(a.name)} <span class="hint">(${fmt(a.weight)})</span></th>`).join('')}<th class="num">Base /20</th><th class="num">★</th><th class="num">Bónus</th><th class="num">Final /20</th><th class="num">Ano /20</th></tr></thead><tbody>${students().map(s=>{let r=periodResult(s.id,periodId);return `<tr><td><strong>${esc(s.name)}</strong></td>${ass.map(a=>`<td class="num">${fmt(assessmentResult(a,s.id)?.score20)}</td>`).join('')}<td class="num">${fmt(r?.base)}</td><td class="num">${starCount(s.id,periodId)}</td><td class="num">+${fmt(bonus(s.id,periodId))}</td><td class="num"><strong>${fmt(r?.total)}</strong></td><td class="num"><strong>${fmt(annualResult(s.id))}</strong></td></tr>`}).join('')||'<tr><td colspan="10" class="empty">Sem alunos.</td></tr>'}</tbody></table></div></section><div style="height:16px"></div><section class="panel"><h2>Resultados por domínio e por avaliação</h2>${ass.map(a=>{const ds=[...new Set(questions(a.id).map(q=>q.domain))];return `<h3>${esc(a.name)} <span class="tag">${esc(a.type)}</span></h3><div class="tablewrap"><table><thead><tr><th>Aluno</th>${ds.map(d=>`<th class="num">${esc(d)} (%)</th>`).join('')}<th class="num">Prova /200</th></tr></thead><tbody>${students().map(s=>`<tr><td>${esc(s.name)}</td>${ds.map(d=>`<td class="num">${fmt(domainResult(a.id,s.id,d))}</td>`).join('')}<td class="num">${fmt(assessmentResult(a,s.id)?.score200)}</td></tr>`).join('')||'<tr><td>Sem alunos</td></tr>'}</tbody></table></div><div class="divider"></div>`}).join('')||'<div class="empty">Sem avaliações.</div>'}</section>`)}
function schoolYearsPage(){return `<div class="layout"><section class="panel span12"><div class="flex between"><h2>Anos letivos e regimes de avaliação</h2><button class="btn primary" onclick="editSchoolYear()">+ Ano letivo</button></div><p class="help">Define os regimes e os períodos de cada ano letivo. Depois, associa cada turma ao respetivo regime em Turmas.</p>${db.schoolYears.map(y=>`<div class="panel" style="margin-bottom:12px"><div class="flex between"><h3>${esc(y.name)}</h3><div class="flex"><button class="btn small" onclick="editSchoolYear('${y.id}')">Editar ano</button><button class="btn small primary" onclick="editRegime('','${y.id}')">+ Regime</button></div></div>${db.regimes.filter(r=>r.schoolYearId===y.id).map(r=>`<div style="padding:10px;border-top:1px solid #eee"><div class="flex between"><strong>${esc(r.name)} (${esc(r.type)})</strong><div class="flex"><button class="btn small" onclick="editRegime('${r.id}')">Editar</button><button class="btn small" onclick="editPeriod('','${r.id}')">+ Período</button></div></div><div class="flex" style="margin-top:8px">${db.periods.filter(p=>p.regimeId===r.id).sort((a,b)=>a.order-b.order).map(p=>`<button class="btn small" onclick="editPeriod('${p.id}','${r.id}')">${esc(p.name)} ${p.start?'· '+esc(p.start):''} ${p.end?'—'+esc(p.end):''}</button> <button class="btn danger small" onclick="removePeriod('${p.id}')">×</button>`).join('')||'<span class="hint">Ainda sem períodos</span>'}</div></div>`).join('')||'<p class="hint">Adiciona um regime semestral ou trimestral.</p>'}</div>`).join('')||'<p class="hint">Ainda não existem anos letivos. Começa por criar um.</p>'}<div class="note">Os períodos pertencem ao regime de avaliação. Para associar uma turma, utiliza <strong>Turmas → Nova turma / Editar</strong> e escolhe o ano letivo e o regime.</div></section></div>`}
function settingsPage(){const s=db.settings;return `<div class="layout"><section class="panel span6"><h2>Regras globais de classificação</h2><div class="stack"><div class="field"><label>Cálculo da nota anual</label><select id="cfgMethod"><option value="average" ${s.yearMethod==='average'?'selected':''}>Média das notas dos períodos/semestres</option><option value="last" ${s.yearMethod==='last'?'selected':''}>Nota do último período/semestre com avaliação</option></select></div><div class="field"><label>Máximo de estrelas para bónus integral</label><input id="cfgMax" type="number" min="1" step="1" value="${s.starMax}"></div><div class="field"><label>Majoração máxima por período (valores, 0 a 20)</label><input id="cfgBonus" type="number" min="0" max="20" step="0.01" value="${s.starBonus}"></div><div class="note">Regra: bónus = min(estrelas, máximo) / máximo × majoração. Exemplo: 1 estrela de um máximo de 25 e majoração 1 → +0,04 valores.</div><button class="btn primary" onclick="saveSettings()">Guardar regras</button></div></section><section class="panel span6"><h2>Google Sheets · base de dados</h2><p class="help">A página guarda sempre uma cópia neste navegador. O Aestimatio utiliza a pasta /aestimatio no Google Drive (criada ou reutilizada automaticamente). A integração requer Google Sheets API, Google Drive API e nova autorização OAuth para gerir os ficheiros.</p><div class="stack"><div class="field"><label>Google OAuth Client ID</label><input id="cfgClient" value="${esc(s.clientId)}" placeholder="...apps.googleusercontent.com"></div><div class="field"><label>ID da spreadsheet (vazio para criar uma nova)</label><input id="cfgSheet" value="${esc(s.spreadsheetId)}" placeholder="ID do URL do Google Sheets"></div><div class="flex"><button class="btn" onclick="saveGoogleSettings()">Guardar ligação</button><button class="btn" onclick="googleSignIn()">Iniciar sessão Google</button></div><span class="hint" id="googleState">${googleToken?'Sessão Google autorizada':'Google não ligado'}</span><div class="flex"><button class="btn" onclick="createSpreadsheet()">+ Criar spreadsheet em /aestimatio</button><button class="btn" onclick="moveExistingSheetToFolder()">Organizar folha existente</button><button class="btn" onclick="discoverDatabase()">Procurar base no Drive</button><button class="btn primary" onclick="pushSheets()">↑ Enviar dados para Sheets</button><button class="btn" onclick="pullSheets()">↓ Importar de Sheets</button></div><p class="hint">Última sincronização: ${esc(s.lastSync||'nunca')}. A sincronização é manual: enviar substitui as tabelas remotas; importar substitui os dados locais, após confirmação. Faz uma cópia de segurança antes de importar.</p></div></section><section class="panel span6"><h2>Google Docs · documentos das avaliações</h2><p class="help">Associa um documento Google Docs a cada teste ou questão de aula. Depois de iniciares sessão Google, podes procurar os teus documentos e selecionar o adequado ao editar uma avaliação.</p><div class="stack"><div class="field"><label for="docsSearch">Nome do documento</label><input id="docsSearch" type="search" placeholder="Ex.: Teste História 10.º ano" onkeydown="if(event.key==='Enter'){event.preventDefault();listDocs()}"></div><div class="field"><label for="docsScope">Localização da pesquisa</label><select id="docsScope"><option value="aestimatio" selected>Pasta /aestimatio (predefinida)</option><option value="drive">Todo o meu Google Drive</option></select></div><button class="btn primary" onclick="listDocs()">Procurar documentos</button><span class="hint">Por omissão, pesquisa documentos diretamente na pasta /aestimatio.</span><div id="docsList" aria-live="polite" style="margin-top:12px"></div></div></section><section class="panel span6"><h2>Segurança e cópias de segurança</h2><p class="help">Usa a exportação JSON para guardar ou transferir todos os registos. O ficheiro Excel é um relatório exportado, não uma cópia reimportável da base.</p><div class="flex"><button class="btn primary" onclick="exportExcel()">↓ Exportar Excel</button><button class="btn" onclick="exportJSON()">↓ Cópia JSON</button><label class="btn" style="cursor:pointer">↑ Importar JSON <input type="file" accept=".json,application/json" hidden onchange="importJSON(this)"></label></div><div class="divider"></div><button class="btn danger" onclick="clearAll()">Apagar todos os dados locais</button><p class="hint">Os dados dos alunos são pessoais. Usa contas escolares autorizadas, controla a partilha da spreadsheet e evita computadores partilhados.</p></section></div>`}
function openModal(title,body,onSubmit){E('modalTitle').textContent=title;E('modalBody').innerHTML=body;modalSubmit=onSubmit;E('modal').showModal()}
function closeModal(){E('modal').close();modalSubmit=null}
E('modalForm').addEventListener('submit',ev=>{ev.preventDefault();try{if(modalSubmit?.(new FormData(ev.target))!==false){save();closeModal();render();toast('Alterações guardadas')}}catch(e){toast(e.message,true)}});
function field(label,name,value='',type='text',extra=''){return `<div class="field"><label>${esc(label)}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function editClass(id=''){if(!db.schoolYears.length||!db.regimes.length){toast('Configura primeiro o ano letivo e os regimes em Anos letivos e regimes',true);setView('schoolYears');return}const c=by('classes',id)||{},yearId=c.schoolYearId||db.schoolYears[0].id;openModal(id?'Editar turma':'Nova turma',`<div class="formgrid">${field('Nome da turma','name',c.name||'')}<div class="field"><label>Ano letivo</label><select name="schoolYearId" onchange="filterClassRegimes(this.value)">${db.schoolYears.map(y=>`<option value="${y.id}" ${y.id===yearId?'selected':''}>${esc(y.name)}</option>`).join('')}</select></div><div class="field full"><label>Regime de avaliação</label><select id="classRegime" name="regimeId">${db.regimes.filter(r=>r.schoolYearId===yearId).map(r=>`<option value="${r.id}" ${r.id===c.regimeId?'selected':''}>${esc(r.name)}</option>`).join('')}</select></div></div>`,f=>{const name=f.get('name').trim(),schoolYearId=f.get('schoolYearId'),regimeId=f.get('regimeId');if(!name||by('regimes',regimeId)?.schoolYearId!==schoolYearId)throw Error('Seleciona um ano letivo e regime válidos');if(id&&c.regimeId!==regimeId){const assigned=db.assessments.filter(a=>a.classId===id),haveGrades=assigned.some(a=>db.grades.some(g=>g.assessmentId===a.id));if(haveGrades)throw Error('Esta turma tem classificações. Para preservar o histórico, o regime não pode ser alterado sem migração supervisionada.');if(assigned.length){const target=db.periods.filter(p=>p.regimeId===regimeId);const changes=assigned.map(a=>({a,p:target.find(p=>p.order===by('periods',a.periodId)?.order)}));if(changes.some(x=>!x.p))throw Error('As avaliações atuais não têm períodos equivalentes no novo regime.');if(!confirm('Alterar regime e remapear as avaliações existentes para períodos equivalentes?'))return false;changes.forEach(x=>x.a.periodId=x.p.id)}}if(id)Object.assign(c,{name,schoolYearId,regimeId});else{const x={id:uid(),name,schoolYearId,regimeId};db.classes.push(x);classId=x.id;periodId=''}})}
function filterClassRegimes(yearId){const select=E('classRegime');select.innerHTML=db.regimes.filter(r=>r.schoolYearId===yearId).map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}
function editSchoolYear(id=''){const y=by('schoolYears',id)||{};openModal(id?'Editar ano letivo':'Novo ano letivo',`<div class="formgrid">${field('Ano letivo (ex.: 2026/2027)','name',y.name||'2026/2027')}${field('Início','start',y.start||'','date')}${field('Fim','end',y.end||'','date')}</div>`,f=>{const name=f.get('name').trim(),start=f.get('start'),end=f.get('end');if(!/^\d{4}\/\d{4}$/.test(name)||start&&end&&start>end)throw Error('Ano letivo ou datas inválidas');if(db.schoolYears.some(x=>x.id!==id&&x.name===name))throw Error('Ano letivo já existente');if(id)Object.assign(y,{name,start,end});else db.schoolYears.push({id:uid(),name,start,end})})}
function editRegime(id='',yearId=''){yearId=yearId||by('regimes',id)?.schoolYearId||db.schoolYears[0]?.id;if(!yearId)return;const r=by('regimes',id)||{};openModal(id?'Editar regime':'Novo regime',`<div class="formgrid">${field('Nome','name',r.name||'Regime semestral')}<div class="field"><label>Tipo</label><select name="type"><option value="semestral" ${r.type==='semestral'?'selected':''}>Semestral</option><option value="trimestral" ${r.type==='trimestral'?'selected':''}>Trimestral</option><option value="personalizado" ${r.type==='personalizado'?'selected':''}>Personalizado</option></select></div></div>`,f=>{const name=f.get('name').trim(),type=f.get('type');if(!name)throw Error('Nome obrigatório');if(id){if(type!==r.type&&db.periods.some(p=>p.regimeId===id)&&!confirm('Alterar o tipo do regime não altera os períodos já definidos. Continuar?'))return false;Object.assign(r,{name,type})}else{const regime={id:uid(),schoolYearId:yearId,name,type};db.regimes.push(regime);const labels=type==='semestral'?['1.º semestre','2.º semestre']:type==='trimestral'?['1.º período','2.º período','3.º período']:[];labels.forEach((name,i)=>db.periods.push({id:uid(),regimeId:regime.id,name,order:i+1,start:'',end:''}))}})}
function editStudent(id=''){if(!classId){toast('Cria primeiro uma turma',true);return}const s=by('students',id)||{};openModal(id?'Editar aluno':'Adicionar aluno',`<div class="formgrid">${field('Nome completo','name',s.name||'')}${field('Número','number',s.number||'','text','maxlength="20"')}<div class="full">${field('Identificador interno (opcional)','code',s.code||'')}</div></div>`,f=>{const x={name:f.get('name').trim(),number:f.get('number').trim(),code:f.get('code').trim()};if(!x.name)throw Error('Nome obrigatório');if(id)Object.assign(s,x);else db.students.push({id:uid(),classId,...x})})}
function editPeriod(id='',regimeId=''){regimeId=regimeId||by('periods',id)?.regimeId||db.regimes[0]?.id;if(!regimeId){toast('Cria primeiro um regime em Anos letivos e regimes',true);return}const p=by('periods',id)||{},all=db.periods.filter(x=>x.regimeId===regimeId),max=Math.max(0,...all.map(x=>Number(x.order)||0));openModal(id?'Editar período':'Adicionar período',`<div class="formgrid">${field('Nome','name',p.name||'1.º período')}${field('Ordem','order',p.order||max+1,'number','min="1" step="1"')}${field('Início','start',p.start||'','date')}${field('Fim','end',p.end||'','date')}</div>`,f=>{const x={name:f.get('name').trim(),order:Number(f.get('order')),start:f.get('start'),end:f.get('end')};if(!x.name||!Number.isInteger(x.order)||x.order<1||x.start&&x.end&&x.start>x.end)throw Error('Datas ou ordem inválidas');if(all.some(z=>z.id!==id&&z.order===x.order))throw Error('Já existe um período com esta ordem neste regime');if(id)Object.assign(p,x);else{const item={id:uid(),regimeId,...x};db.periods.push(item);periodId=item.id}})}
function questionRows(){return draftQuestions.map((q,i)=>`<div class="formgrid" style="align-items:end;margin-bottom:9px" data-qi="${i}"><div class="field"><label>Pergunta</label><input class="qname" value="${esc(q.name)}" required></div><div class="field"><label>Domínio</label><input class="qdomain" value="${esc(q.domain)}" required></div><div class="field"><label>Cotação (pontos)</label><input class="qmax" type="number" min="0.01" max="200" step="0.01" value="${q.max}" required></div><div><button type="button" class="btn danger small" onclick="delQuestion(${i})">Remover pergunta</button></div></div>`).join('')}
function captureQuestions(){const rows=[...E('questionEditor').querySelectorAll('[data-qi]')];draftQuestions=rows.map((r,i)=>({id:draftQuestions[i]?.id||uid(),name:r.querySelector('.qname').value,domain:r.querySelector('.qdomain').value,max:r.querySelector('.qmax').value,order:i+1}))}
function addQuestion(){captureQuestions();draftQuestions.push({id:uid(),name:'P'+(draftQuestions.length+1),domain:'Domínio 1',max:10,order:draftQuestions.length+1});E('questionEditor').innerHTML=questionRows()}
function delQuestion(i){captureQuestions();draftQuestions.splice(i,1);E('questionEditor').innerHTML=questionRows()}
function editAssessment(id=''){if(!periodId){toast('Cria primeiro um período/semestre',true);return}const a=by('assessments',id)||{};draftQuestions=id?questions(id).map(x=>({...x})):[];openModal(id?'Editar avaliação':'Nova avaliação',`<div class="formgrid">${field('Nome','name',a.name||'Teste 1')}<div class="field"><label>Tipo</label><select name="type"><option ${a.type!=='Questão de aula'?'selected':''}>Teste</option><option ${a.type==='Questão de aula'?'selected':''}>Questão de aula</option></select></div>${field('Data','date',a.date||new Date().toISOString().slice(0,10),'date')}${field('Peso relativo no período','weight',a.weight??1,'number','min="0" step="0.01"')}<div class="full">${field('Google Docs · ID do documento (opcional)','docId',a.docId||'','text','placeholder="ID extraído de docs.google.com/document/d/ID/edit"')}</div></div><div class="divider"></div><div class="flex between"><h3>Perguntas e domínios</h3><button type="button" class="btn small" onclick="addQuestion()">+ Pergunta</button></div><div id="questionEditor">${questionRows()}</div><p class="hint">A soma das cotações deve ser 200 pontos. Os resultados de cada domínio usam apenas as perguntas atribuídas a esse domínio. Alterar ou remover perguntas já classificadas pode afetar resultados anteriores.</p>`,f=>{captureQuestions();const name=f.get('name').trim(),weight=Number(f.get('weight'));if(!name||weight<0||!Number.isFinite(weight))throw Error('Nome ou peso inválido');if(draftQuestions.some(q=>!q.name.trim()||!q.domain.trim()||Number(q.max)<=0||!Number.isFinite(Number(q.max))))throw Error('Verifica as perguntas');const total=draftQuestions.reduce((n,q)=>n+Number(q.max),0);if(draftQuestions.length&&Math.abs(total-200)>.001)throw Error(`A cotação deve somar 200 pontos (atualmente ${fmt(total)}).`);const x={name,type:f.get('type'),date:f.get('date'),weight,docId:f.get('docId').trim()};let aid=id;if(id)Object.assign(a,x);else{aid=uid();db.assessments.push({id:aid,classId,periodId,...x})}const previous=questions(aid).map(q=>q.id),current=new Set(draftQuestions.map(q=>q.id));db.questions=db.questions.filter(q=>q.assessmentId!==aid);db.questions.push(...draftQuestions.map((q,i)=>({id:q.id,assessmentId:aid,name:q.name.trim(),domain:q.domain.trim(),max:Number(q.max),order:i+1})));db.grades=db.grades.filter(g=>!previous.includes(g.questionId)||current.has(g.questionId));return true})}
function confirmDelete(txt){return confirm('Eliminar '+txt+'? Esta ação não pode ser desfeita. Faz uma cópia de segurança se necessário.')}
function removeClass(id){if(!confirmDelete('esta turma, alunos, avaliações e estrelas (os períodos partilhados serão mantidos)'))return;const ass=db.assessments.filter(x=>x.classId===id).map(x=>x.id),qs=db.questions.filter(x=>ass.includes(x.assessmentId)).map(x=>x.id);db.classes=db.classes.filter(x=>x.id!==id);for(const t of ['students','assessments','stars'])db[t]=db[t].filter(x=>x.classId!==id);db.questions=db.questions.filter(x=>!ass.includes(x.assessmentId));db.grades=db.grades.filter(x=>!ass.includes(x.assessmentId)&&!qs.includes(x.questionId));save();render()}
function removeStudent(id){if(!confirmDelete('este aluno e todas as suas notas e estrelas'))return;db.students=db.students.filter(x=>x.id!==id);db.grades=db.grades.filter(x=>x.studentId!==id);db.stars=db.stars.filter(x=>x.studentId!==id);save();render()}
function removePeriod(id){const linked=db.assessments.some(a=>a.periodId===id)||db.stars.some(e=>e.periodId===id);if(linked){toast('Período utilizado por avaliações ou estrelas. Não pode ser removido.',true);return}if(!confirmDelete('este período do regime'))return;db.periods=db.periods.filter(x=>x.id!==id);save();render()}
function removeAssessment(id){if(!confirmDelete('esta avaliação, perguntas e classificações'))return;db.assessments=db.assessments.filter(x=>x.id!==id);db.questions=db.questions.filter(x=>x.assessmentId!==id);db.grades=db.grades.filter(x=>x.assessmentId!==id);save();render()}
function setGrade(a,s,q,input){const question=by('questions',q),raw=input.value.trim();if(raw!==''&&(!Number.isFinite(Number(raw))||Number(raw)<0||Number(raw)>Number(question.max))){toast(`Classificação inválida: entre 0 e ${fmt(question.max)}`,true);input.value=grade(a,s,q)??'';return}db.grades=db.grades.filter(x=>!(x.assessmentId===a&&x.studentId===s&&x.questionId===q));if(raw!=='')db.grades.push({id:uid(),assessmentId:a,studentId:s,questionId:q,score:Number(raw)});save();const row=input.closest('tr'),ass=by('assessments',a),result=assessmentResult(ass,s);if(row){const cells=row.querySelectorAll('td');const count=questions(a).length;const domains=[...new Set(questions(a).map(x=>x.domain))];cells[count+1].textContent=fmt(result?.earned);cells[count+2].textContent=fmt(result?.score200);cells[count+3].querySelector('strong').textContent=fmt(result?.score20);domains.forEach((d,i)=>{cells[count+4+i].textContent=fmt(domainResult(a,s,d))+'%'})}}
function addStar(id){if(!periodId)return;db.stars.push({id:uid(),classId,periodId,studentId:id,count:1,note:'',createdAt:new Date().toISOString()});save();render()}
function undoStar(id){const logs=db.stars.filter(x=>x.studentId===id&&x.periodId===periodId).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));if(!logs.length)return;db.stars=db.stars.filter(x=>x.id!==logs[0].id);save();render()}
function removeStar(id){if(!confirm('Remover este registo de estrelas?'))return;db.stars=db.stars.filter(x=>x.id!==id);save();render()}
function saveSettings(){const a=Number(E('cfgMax').value),b=Number(E('cfgBonus').value);if(!Number.isInteger(a)||a<1||!Number.isFinite(b)||b<0||b>20){toast('Máximo de estrelas ou bónus inválido',true);return}Object.assign(db.settings,{yearMethod:E('cfgMethod').value,starMax:a,starBonus:b});save();render();syncSidebar();toast('Regras globais guardadas')}
function saveGoogleSettings(){db.settings.clientId=E('cfgClient').value.trim();db.settings.spreadsheetId=E('cfgSheet').value.trim();googleToken='';tokenClient=null;save();render();toast('Configuração Google guardada')}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function exportJSON(){downloadBlob(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'atlas_copia_'+new Date().toISOString().slice(0,10)+'.json')}
async function importJSON(input){const file=input.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!data||!Array.isArray(data.classes)||!Array.isArray(data.grades)||!data.settings)throw Error('Ficheiro de dados inválido');if(!confirm('Substituir TODOS os dados locais pelos do ficheiro?'))return;db={...empty(),...data,settings:{...empty().settings,...data.settings}};db=migrateData(db);save();classId='';periodId='';render();toast('Cópia de segurança importada')}catch(e){toast(e.message,true)}input.value=''}
function clearAll(){if(!confirm('Apagar TODOS os dados do navegador? Esta ação é irreversível.'))return;if(!confirm('Confirmas a eliminação definitiva dos dados locais?'))return;db=empty();classId='';periodId='';assessmentId='';save();render();toast('Dados locais eliminados')}
function excelSheets(){const rows=[];for(const c of db.classes){for(const s of db.students.filter(x=>x.classId===c.id)){const pr=db.periods.filter(x=>x.regimeId===c.regimeId).sort((a,b)=>a.order-b.order);for(const p of pr){const r=periodResult(s.id,p.id);rows.push({Turma:c.name,'Ano letivo':by('schoolYears',c.schoolYearId)?.name,Numero:s.number,Aluno:s.name,Periodo:p.name,'Nota base /20':r?.base??'','Estrelas':starCount(s.id,p.id),'Bonus /20':r?.bonus??bonus(s.id,p.id),'Nota final /20':r?.total??'','Nota anual /20':annualResult(s.id)??''})}}}const detailed=[];for(const a of db.assessments){const c=by('classes',a.classId),p=by('periods',a.periodId);for(const s of db.students.filter(x=>x.classId===a.classId)){const r=assessmentResult(a,s.id);detailed.push({Turma:c?.name||'',Periodo:p?.name||'',Aluno:s.name,Numero:s.number,Avaliacao:a.name,Tipo:a.type,Data:a.date,Peso:a.weight,'Pontos obtidos':r?.earned??'','Pontos possiveis':r?.total??'','Classificacao /200':r?.score200??'','Classificacao /20':r?.score20??'',Corrigidas:r?.filled??0,'Total de perguntas':questions(a.id).length})}}const domains=[];for(const a of db.assessments){const ds=[...new Set(questions(a.id).map(q=>q.domain))];for(const s of db.students.filter(x=>x.classId===a.classId))for(const d of ds)domains.push({Turma:by('classes',a.classId)?.name||'',Periodo:by('periods',a.periodId)?.name||'',Avaliacao:a.name,Aluno:s.name,Dominio:d,'Resultado %':domainResult(a.id,s.id,d)??''})}const pointRows=[];for(const a of db.assessments)for(const s of db.students.filter(x=>x.classId===a.classId))for(const q of questions(a.id))pointRows.push({Turma:by('classes',a.classId)?.name||'',Periodo:by('periods',a.periodId)?.name||'',Aluno:s.name,Avaliacao:a.name,Pergunta:q.name,Dominio:q.domain,'Cotacao':q.max,'Pontos':grade(a.id,s.id,q.id)??''});return {'Resumo de notas':rows,'Avaliacoes':detailed,'Dominios':domains,'Perguntas e notas':pointRows,'Anos letivos':db.schoolYears,'Regimes':db.regimes,'Turmas':db.classes,'Alunos':db.students,'Periodos':db.periods,'Configuracao':[{'Metodo anual':db.settings.yearMethod==='average'?'Média dos períodos':'Último período','Max estrelas':db.settings.starMax,'Bonus max /20':db.settings.starBonus}]}}
function exportExcel(){if(typeof XLSX==='undefined'){toast('A biblioteca Excel não carregou. Liga-te à internet e volta a tentar.',true);return}const wb=XLSX.utils.book_new();for(const [name,rows] of Object.entries(excelSheets())){const sheet=XLSX.utils.json_to_sheet(rows.length?rows:[{Info:'Sem dados'}]);sheet['!cols']=Object.keys(rows[0]||{Info:''}).map(k=>({wch:Math.min(38,Math.max(13,k.length+4))}));XLSX.utils.book_append_sheet(wb,sheet,name.slice(0,31))}XLSX.writeFile(wb,'atlas_avaliacao_'+new Date().toISOString().slice(0,10)+'.xlsx');toast('Excel exportado com folhas organizadas')}
// Google OAuth via GIS + Google Sheets REST. All sync actions are explicit.
const SCOPES='https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive';
function googleSignIn(){const cid=db.settings.clientId;if(!cid){toast('Guarda primeiro o Client ID OAuth nas definições',true);return}if(!window.google?.accounts?.oauth2){toast('O serviço de autenticação Google não carregou.',true);return}tokenClient=google.accounts.oauth2.initTokenClient({client_id:cid,scope:SCOPES,callback:async response=>{if(response.error){toast('Autorização Google falhou: '+response.error,true);return}googleToken=response.access_token;try{await ensureDriveFolder();toast('Conta Google autorizada. Pasta aestimatio pronta.')}catch(e){toast('Google autorizado, mas não foi possível preparar a pasta: '+e.message,true)}if(view==='settings')render();await discoverDatabase()}});tokenClient.requestAccessToken({prompt:'consent'})}
async function apiGoogle(url,options={}){if(!googleToken)throw Error('Inicia sessão Google antes de sincronizar');const resp=await fetch(url,{...options,headers:{Authorization:'Bearer '+googleToken,'Content-Type':'application/json',...(options.headers||{})}});let data;try{data=await resp.json()}catch{data={}}if(!resp.ok)throw Error(data.error?.message||`Google API: erro ${resp.status}`);return data}
async function ensureDriveFolder(){if(!googleToken)throw Error('Inicia sessão Google');const base='https://www.googleapis.com/drive/v3/files';const stored=db.settings.driveFolderId;if(stored){try{const info=await apiGoogle(base+'/'+encodeURIComponent(stored)+'?fields=id,name,mimeType,trashed,parents');if(!info.trashed&&info.name==='aestimatio'&&info.mimeType==='application/vnd.google-apps.folder')return stored}catch(e){if(!/not found|404/i.test(e.message))throw e}}
const q="'root' in parents and name = 'aestimatio' and mimeType = 'application/vnd.google-apps.folder' and trashed = false";const found=await apiGoogle(base+'?'+new URLSearchParams({q,fields:'nextPageToken,files(id,name,parents)',pageSize:'100'}));let folder=found.files?.[0];if(!folder){folder=await apiGoogle(base+'?fields=id,name',{method:'POST',body:JSON.stringify({name:'aestimatio',mimeType:'application/vnd.google-apps.folder',parents:['root']})})}db.settings.driveFolderId=folder.id;save();return folder.id}
async function discoverDatabase(){if(!googleToken)return;try{const folder=await ensureDriveFolder();const q="'"+folder+"' in parents and mimeType = 'application/vnd.google-apps.spreadsheet' and trashed = false";const res=await apiGoogle('https://www.googleapis.com/drive/v3/files?'+new URLSearchParams({q,fields:'nextPageToken,files(id,name,modifiedTime)',orderBy:'modifiedTime desc',pageSize:'100'}));const files=(res.files||[]).filter(f=>/Atlas|Aestimatio|Avaliação Sumativa/i.test(f.name));if(!files.length){toast('Não foi encontrada uma base de dados Aestimatio em /aestimatio. Podes criar uma nas Definições.');return}if(files.length===1){db.settings.spreadsheetId=files[0].id;save();if(view==='settings')render();if(!db.classes.length&&!db.students.length&&!db.assessments.length){await pullSheets(true)}else toast('Base de dados encontrada no Drive. Usa Importar de Sheets para carregar os dados sem substituir alterações locais automaticamente.');return}const chosen=prompt('Foram encontradas várias bases. Introduz o número da base pretendida:\n'+files.map((f,i)=>(i+1)+'. '+f.name).join('\n'),'1');const f=files[Number(chosen)-1];if(f){db.settings.spreadsheetId=f.id;save();if(view==='settings')render();toast('Base selecionada. Usa Importar de Sheets para carregar os dados.')}}catch(e){toast('Não foi possível localizar a base no Drive: '+e.message,true)}}
async function moveExistingSheetToFolder(){const id=db.settings.spreadsheetId;if(!id){toast('Configura a folha Google Sheets primeiro',true);return}if(!confirm('Mover a folha Google Sheets configurada para a pasta /aestimatio? Não será apagada.'))return;try{const folder=await ensureDriveFolder(),base='https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(id),file=await apiGoogle(base+'?fields=id,parents,name');if(file.parents?.includes(folder)){toast('A folha já está na pasta aestimatio');return}const qs=new URLSearchParams({addParents:folder,fields:'id,parents,name'});if(file.parents?.length)qs.set('removeParents',file.parents.join(','));await apiGoogle(base+'?'+qs.toString(),{method:'PATCH',body:'{}'});toast('Folha movida para /aestimatio')}catch(e){toast('Erro ao organizar a folha: '+e.message,true)}}
async function createSpreadsheet(){if(!googleToken){toast('Inicia sessão Google primeiro',true);return}try{const folder=await ensureDriveFolder();const data=await apiGoogle('https://www.googleapis.com/drive/v3/files?fields=id,name,webViewLink',{method:'POST',body:JSON.stringify({name:'Atlas - Base de dados Avaliação Sumativa',mimeType:'application/vnd.google-apps.spreadsheet',parents:[folder]})});db.settings.spreadsheetId=data.id;save();render();toast('Spreadsheet criada dentro de /aestimatio. Agora envia os dados para Sheets.');window.open(data.webViewLink||'https://docs.google.com/spreadsheets/d/'+encodeURIComponent(data.id)+'/edit','_blank','noopener')}catch(e){toast('Erro ao criar spreadsheet: '+e.message,true)}}
const TABNAMES={schoolYears:'AnosLetivos',regimes:'Regimes',classes:'Turmas',students:'Alunos',periods:'Periodos',assessments:'Avaliacoes',questions:'Perguntas',grades:'Classificacoes',stars:'Estrelas'};
async function ensureTabs(id){const url='https://sheets.googleapis.com/v4/spreadsheets/'+encodeURIComponent(id);const obj=await apiGoogle(url+'?fields=sheets.properties');const names=new Set((obj.sheets||[]).map(x=>x.properties.title));const needed=['Atlas_Config',...Object.values(TABNAMES)].filter(x=>!names.has(x));if(needed.length)await apiGoogle(url+':batchUpdate',{method:'POST',body:JSON.stringify({requests:needed.map(title=>({addSheet:{properties:{title}}}))})})}
async function pushSheets(){const id=db.settings.spreadsheetId;if(!id){toast('Indica ou cria uma spreadsheet nas definições',true);return}if(!googleToken){toast('Inicia sessão Google primeiro',true);return}if(!confirm('Enviar todos os dados locais para a spreadsheet? Isto substitui os dados nas tabelas Atlas da spreadsheet.'))return;try{await ensureDriveFolder();await ensureTabs(id);const base='https://sheets.googleapis.com/v4/spreadsheets/'+encodeURIComponent(id)+'/values';const ranges=["'Atlas_Config'!A1:B2",...Object.values(TABNAMES).map(n=>`'${n}'!A1:B10000`)];await apiGoogle(base+':batchClear',{method:'POST',body:JSON.stringify({ranges})});const data=[{range:"'Atlas_Config'!A1:B2",values:[['key','json'],['settings',JSON.stringify({...db.settings,clientId:'',spreadsheetId:'',lastSync:''})]]},...Object.entries(TABNAMES).map(([key,tab])=>({range:`'${tab}'!A1:B${Math.max(2,db[key].length+1)}`,values:[['id','json'],...db[key].map(x=>[x.id,JSON.stringify(x)])]}))];await apiGoogle(base+':batchUpdate',{method:'POST',body:JSON.stringify({valueInputOption:'RAW',data})});db.settings.lastSync=new Date().toLocaleString('pt-PT');save();render();toast('Dados enviados com sucesso para Google Sheets')}catch(e){toast('Erro ao enviar: '+e.message,true)}}
async function pullSheets(auto=false){const id=db.settings.spreadsheetId;if(!id||!googleToken){toast('Configura a spreadsheet e inicia sessão Google',true);return}if(!auto&&!confirm('IMPORTANTE: a Google Sheets irá SUBSTITUIR os dados deste navegador. Exporta uma cópia JSON antes de continuar.'))return;try{const meta=await apiGoogle('https://sheets.googleapis.com/v4/spreadsheets/'+encodeURIComponent(id)+'?fields=sheets.properties.title');const present=new Set((meta.sheets||[]).map(x=>x.properties.title));const keys=Object.entries(TABNAMES).filter(([k,tab])=>present.has(tab)),requested=['Atlas_Config',...keys.map(([key,tab])=>tab)];const uri='https://sheets.googleapis.com/v4/spreadsheets/'+encodeURIComponent(id)+'/values:batchGet?'+requested.map(r=>'ranges='+encodeURIComponent(r+'!A1:B10000')).join('&');const out=await apiGoogle(uri);const ranges=out.valueRanges||[];const cfg=JSON.parse(ranges[0]?.values?.[1]?.[1]||'{}');const next=empty();next.settings={...db.settings,...cfg,clientId:db.settings.clientId,spreadsheetId:id,driveFolderId:db.settings.driveFolderId,lastSync:new Date().toLocaleString('pt-PT')};keys.forEach(([key],i)=>{next[key]=(ranges[i+1]?.values||[]).slice(1).filter(row=>row[1]).map(row=>JSON.parse(row[1]))});next.version=next.schoolYears.length?2:1;db=migrateData(next);classId='';periodId='';assessmentId='';save();render();toast('Dados importados de Google Sheets')}catch(e){toast('Erro ao importar: '+e.message,true)}}
async function listDocs(){if(!googleToken){toast('Inicia sessão Google primeiro',true);return}const target=E('docsList'),name=(E('docsSearch')?.value||'').trim(),scope=E('docsScope')?.value||'aestimatio';target.textContent='A procurar documentos...';try{let q="mimeType = 'application/vnd.google-apps.document' and trashed = false";if(scope==='aestimatio'){const folder=await ensureDriveFolder();q+=" and '"+folder+"' in parents"}if(name){const safe=name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");q+=" and name contains '"+safe+"'"}let found=[],pageToken='';do{const params=new URLSearchParams({q,fields:'nextPageToken,files(id,name,webViewLink,modifiedTime)',pageSize:'100',orderBy:'modifiedTime desc'});if(pageToken)params.set('pageToken',pageToken);const result=await apiGoogle('https://www.googleapis.com/drive/v3/files?'+params);found.push(...(result.files||[]));pageToken=result.nextPageToken||''}while(pageToken&&found.length<500);docItems=found;target.innerHTML=docItems.length?'<div class="hint">'+docItems.length+' documento(s) encontrado(s)</div>'+docItems.map(d=>'<div class="docitem"><div><strong>'+esc(d.name)+'</strong><div class="hint">'+(d.modifiedTime?esc(new Date(d.modifiedTime).toLocaleDateString('pt-PT')):'')+' · '+esc(d.id)+'</div></div><div class="flex"><button class="btn small" onclick="copyDocId(&quot;'+esc(d.id)+'&quot;)">Copiar ID</button><a class="link" href="https://docs.google.com/document/d/'+encodeURIComponent(d.id)+'/edit" target="_blank" rel="noopener noreferrer">Abrir ↗</a></div></div>').join(''):'<div class="empty">Não foram encontrados documentos com estes filtros.</div>'}catch(e){target.textContent='Não foi possível pesquisar os documentos.';toast('Erro na pesquisa Google Docs: '+e.message,true)}}
async function copyDocId(id){try{await navigator.clipboard.writeText(id);toast('ID copiado')}catch(e){toast('Não foi possível copiar o ID',true)}}
save();render();
</script>
