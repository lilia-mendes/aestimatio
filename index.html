id-column:span 6}.span4{grid-column:span 4}.span3{grid-column:span 3}.stat strong{display:block;font-size:32px;letter-spacing:-1px;margin-top:8px}.stat label{font-size:12px;color:#65758b;font-weight:700}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.field{display:grid;gap:6px;min-width:160px}.field label{font-size:12px;font-weight:750;color:#495b74}.field input,.field select,.field textarea,input.inline,select.inline{width:100%;background:#fff;border:1px solid #cad5e4;border-radius:8px;padding:10px;color:#21314a}.field textarea{min-height:75px}.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid #91b3ff;outline-offset:1px}.tablewrap{overflow-x:auto;width:100%}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;background:#f4f7fb;color:#536781;font-weight:750;font-size:11px;letter-spacing:.3px;white-space:nowrap}td,th{padding:11px 12px;border-bottom:1px solid #edf1f6;vertical-align:middle}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}tr:last-child td{border-bottom:0}.chip{display:inline-block;padding:4px 8px;border-radius:99px;background:#eaf1ff;color:#2854a9;font-size:11px;font-weight:800}.chip.green{background:#e0f7e9;color:#1e8051}.chip.gold{background:#fff1ce;color:#936100}.empty{padding:35px 15px;text-align:center;color:#76869b}.note{background:#edf4ff;color:#3b5579;padding:12px 15px;border-radius:10px;line-height:1.5;margin-bottom:15px}.warning{background:#fff4e0;color:#805822}.score{width:75px!important;padding:7px!important;text-align:right}.stars{display:flex;gap:3px;flex-wrap:wrap}.star{font-size:20px;background:transparent;border:0;color:#d0d6df;padding:1px}.star.on{color:#efa91b}.tablist{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 20px}.tablist button{border:1px solid #d8e0eb;background:white;border-radius:8px;padding:8px 12px;font-weight:700;color:#56708f}.tablist button.on{background:#234fbb;color:white;border-color:#234fbb}.kpi{font-size:27px;font-weight:850;letter-spacing:-.7px}.progress{background:#e6edf8;border-radius:99px;height:8px;overflow:hidden}.progress>div{height:100%;background:#417ee0}.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.right{text-align:right}.hint{font-size:12px;color:#6c7f97}.badgeplus{color:#1d8259;font-weight:800}.stack{display:grid;gap:12px}.divider{height:1px;background:#edf0f4;margin:14px 0}.emptytiny{color:#8a98a9;font-style:italic}.tag{background:#eff3f9;border-radius:6px;padding:3px 7px;font-size:11px}.toast{position:fixed;bottom:22px;right:22px;z-index:30;border-radius:11px;padding:13px 18px;background:#173e75;color:#fff;box-shadow:0 8px 30px #101e3540;max-width:430px;display:none}.toast.error{background:#a03244}.dialog{border:0;border-radius:17px;box-shadow:0 18px 80px #152b4660;padding:0;width:min(680px,94vw);max-height:90vh;overflow:auto}.dialog::backdrop{background:#0d1e3388}.dialog .head{padding:21px 24px;border-bottom:1px solid #e6ebf2}.dialog .body{padding:23px 24px}.dialog .foot{padding:16px 24px;border-top:1px solid #e6ebf2;display:flex;justify-content:flex-end;gap:9px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}.scoregrid{font-size:12px}.scoregrid th:first-child,.scoregrid td:first-child{position:sticky;left:0;background:#fff;min-width:190px;z-index:1}.scoregrid th:first-child{background:#f4f7fb;z-index:2}.scoregrid input{width:67px;border:1px solid #cad5e4;border-radius:7px;padding:7px}.scoregrid input:invalid{border-color:#be4354;background:#fff1f2}.scoregrid .domainhead{background:#edf2fb}.docitem{display:flex;justify-content:space-between;gap:12px;padding:10px;border-bottom:1px solid #edf1f6}.pill{border:1px solid #cfd9e6;border-radius:8px;padding:8px 11px;background:white;font-weight:700}.help{line-height:1.65;color:#556780}.footerline{margin-top:20px;color:#91a0b5;font-size:11px}.link{color:#245cc5;text-decoration:none}.link:hover{text-decoration:underline}@media(max-width:920px){ <body>
<div class="app"><aside class="sidebar"><div class="brand">✦ Atlas <small>Avaliação somativa</small></div><nav class="nav" id="nav"></nav><div class="sidefoot">Dados guardados neste navegador.<br><span id="saveState">Pronto para trabalhar</span></div></aside><main class="main"><div class="top"><div><div class="eyebrow" id="crumb">PAINEL DE CONTROLO</div><h1 id="pageTitle">Avaliação das turmas</h1><div class="muted" id="subtitle">Organiza resultados e acompanha a evolução.</div></div><div class="toolbar"><button class="btn" onclick="exportExcel()">↓ Exportar Excel</button><button class="btn primary" onclick="setView('settings')">⚙ Configurações</button></div></div><div id="content"></div><div class="footerline">Atlas · Aplicação local e estática · As notas são calculadas a partir das classificações registadas.</div></main></div>
<div id="toast" class="toast"></div><dialog id="modal" class="dialog"><div class="head"><h2 id="modalTitle" style="margin:0"></h2></div><form id="modalForm"><div class="body" id="modalBody"></div><div class="foot"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button type="submit" class="btn primary" id="modalSave">Guardar</button></div></form></dialog>
<script>
'use strict';
const STORE='atlas_somativa_v1';
const uid=()=>crypto.randomUUID?crypto.randomUUID():'id_'+Date.now()+'_'+Math.random().toString(36).slice(2);
const empty=()=>({version:1,classes:[],students:[],periods:[],assessments:[],questions:[],grades:[],stars:[],settings:{yearMethod:'average',starMax:25,starBonus:1,clientId:'',spreadsheetId:'',lastSync:''}});
let db;try{db=JSON.parse(localStorage.getItem(STORE))||empty()}catch{db=empty()};for(const k of ['classes','students','periods','assessments','questions','grades','stars'])if(!Array.isArray(db[k]))db[k]=[];db.settings={...empty().settings,...db.settings};
let view='dashboard',classId=db.classes[0]?.id||'',periodId='',assessmentId='',draftQuestions=[],modalSubmit=null,tokenClient=null,googleToken='',docItems=[];
const $=s=>document.querySelector(s), E=s=>document.getElementById(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n===null||n===undefined||Number.isNaN(n)?'—':Number(n).toLocaleString('pt-PT',{minimumFractionDigits:0,maximumFractionDigits:2});
const round=n=>Math.round((n+Number.EPSILON)*100)/100;
const by=(type,id)=>db[type].find(x=>x.id===id);
const inClass=(type)=>db[type].filter(x=>x.classId===classId);
const periods=()=>inClass('periods').sort((a,b)=>a.order-b.order);
const students=()=>inClass('students').sort((a,b)=>a.name.localeCompare(b.name,'pt'));
const assessments=(p=periodId)=>inClass('assessments').filter(a=>a.periodId===p).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
const questions=a=>db.questions.filter(q=>q.assessmentId===a).sort((x,y)=>x.order-y.order);
function save(){localStorage.setItem(STORE,JSON.stringify(db));E('saveState').textContent='Guardado às '+new Date().toLocaleTimeString('pt-PT');}
function toast(s,error=false){const n=E('toast');n.textContent=s;n.className='toast'+(error?' error':'');n.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>n.style.display='none',4200)}
function syncSelection(){if(!by('classes',classId))classId=db.classes[0]?.id||'';if(!by('periods',periodId)||by('periods',periodId)?.classId!==classId)periodId=periods()[0]?.id||'';if(!by('assessments',assessmentId)||by('assessments',assessmentId)?.periodId!==periodId)assessmentId=assessments()[0]?.id||''}
function setClass(id){classId=id;periodId='';assessmentId='';render()}
function setPeriod(id){periodId=id;assessmentId='';render()}
function setView(v){view=v;render()}
function meta(){const titles={dashboard:['Visão geral','Avaliação das turmas','Resultados, médias e indicadores num único local.'],classes:['Turmas','Gerir turmas','Organiza as tuas turmas e os seus períodos.'],students:['Alunos','Alunos da turma','Adiciona, edita ou remove alunos.'],assessments:['Avaliações','Testes e questões de aula','Define perguntas, cotações, domínios e pesos.'],grades:['Classificações','Grelha de classificação','Atribui pontuações por pergunta a cada aluno.'],stars:['Estrelas','Participação e comportamento','Regista estrelas por semestre ou período.'],reports:['Resultados','Resultados finais','Notas por domínio, avaliação, período e ano.'],settings:['Definições','Configuração e sincronização','Regras globais, Google Sheets e cópias de segurança.']};const x=titles[view];E('crumb').textContent=x[0].toUpperCase();E('pageTitle').textContent=x[1];E('subtitle').textContent=x[2]}
function classPicker(){return `<div class="filters"><div class="field"><label>Turma</label><select onchange="setClass(this.value)">${db.classes.length?db.classes.map(c=>`<option value="${c.id}" ${c.id===classId?'selected':''}>${esc(c.name)}</option>`).join(''):'<option value="">Sem turmas</option>'}</select></div>${view!=='students'&&view!=='classes'&&view!=='settings'&&view!=='dashboard'?`<div class="field"><label>Período / semestre</label><select onchange="setPeriod(this.value)">${periods().length?periods().map(p=>`<option value="${p.id}" ${p.id===periodId?'selected':''}>${esc(p.name)}</option>`).join(''):'<option value="">Sem períodos</option>'}</select></div>`:''}</div>`}
function wrap(html){return db.classes.length?classPicker()+html:`<section class="panel empty"><h2>Começa pela tua primeira turma</h2><p>Cria uma turma para poderes associar alunos, períodos e avaliações.</p><button class="btn primary" onclick="editClass()">+ Criar turma</button></section>`}
function render(){syncSelection();meta();const nav=[['dashboard','▦','Resumo'],['classes','▤','Turmas'],['students','♙','Alunos'],['assessments','▣','Avaliações'],['grades','▥','Classificações'],['stars','★','Estrelas'],['reports','◫','Resultados'],['settings','⚙','Definições']];E('nav').innerHTML=nav.map(([id,ico,name])=>`<button class="${view===id?'active':''}" onclick="setView('${id}')">${ico} &nbsp; ${name}</button>`).join('');const pages={dashboard:dashboardPage,classes:classesPage,students:studentsPage,assessments:assessmentsPage,grades:gradesPage,stars:starsPage,reports:reportsPage,settings:settingsPage};E('content').innerHTML=pages[view]();}
function grade(a,s,q){return db.grades.find(g=>g.assessmentId===a&&g.studentId===s&&g.questionId===q)?.score??null}
function assessmentResult(a,s){const qs=questions(a.id),total=qs.reduce((t,q)=>t+Number(q.max),0);if(!qs.length||total<=0)return null;const vals=qs.map(q=>grade(a.id,s,q.id));if(vals.every(v=>v===null))return null;const obtained=qs.reduce((t,q,i)=>t+Number(vals[i]??0),0);return {earned:obtained,total,score200:round(obtained/total*200),score20:round(obtained/total*20),filled:vals.filter(v=>v!==null).length,full:vals.every(v=>v!==null)};}
function starCount(s,p){return db.stars.filter(e=>e.studentId===s&&e.periodId===p).reduce((n,e)=>n+Number(e.count||1),0)}
function bonus(s,p){return round(Math.min(starCount(s,p),Number(db.settings.starMax)||25)/(Number(db.settings.starMax)||25)*(Number(db.settings.starBonus)||0))}
function periodResult(s,p){const tests=assessments(p).map(a=>({a,r:assessmentResult(a,s)})).filter(o=>o.r&&Number(o.a.weight)>0);if(!tests.length)return null;const w=tests.reduce((n,x)=>n+Number(x.a.weight),0);const base=tests.reduce((n,x)=>n+x.r.score20*Number(x.a.weight),0)/w;const b=bonus(s,p);return {base:round(base),bonus:b,total:round(Math.min(20,base+b)),count:tests.length};}
function annualResult(s){const ps=periods(),valid=ps.map(p=>periodResult(s,p.id)).filter(Boolean);if(!valid.length)return null;return db.settings.yearMethod==='last'?valid[valid.length-1].total:round(valid.reduce((n,x)=>n+x.total,0)/valid.length)}
function domainResult(a,s,d){const qs=questions(a).filter(q=>q.domain===d),max=qs.reduce((n,q)=>n+Number(q.max),0);if(!max)return null;const vals=qs.map(q=>grade(a,s,q.id));if(vals.every(v=>v===null))return null;return round(qs.reduce((n,q,i)=>n+Number(vals[i]??0),0)/max*100)}
function dashboardPage(){const c=by('classes',classId);return `<div class="layout"><div class="panel span3 stat"><label>Turmas</label><strong>${db.classes.length}</strong><span class="hint">Registadas</span></div><div class="panel span3 stat"><label>Alunos</label><strong>${db.students.length}</strong><span class="hint">Em todas as turmas</span></div><div class="panel span3 stat"><label>Avaliações</label><strong>${db.assessments.length}</strong><span class="hint">Testes e questões</span></div><div class="panel span3 stat"><label>Estrelas</label><strong>${db.stars.reduce((n,x)=>n+Number(x.count||1),0)}</strong><span class="hint">Registos acumulados</span></div><section class="panel span8"><div class="flex between"><h2>Panorama da turma</h2>${db.classes.length?`<select class="inline" style="width:auto" onchange="setClass(this.value)">${db.classes.map(x=>`<option value="${x.id}" ${x.id===classId?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:''}</div>${c?`<div class="tablewrap"><table><thead><tr><th>Aluno</th>${periods().map(p=>`<th class="num">${esc(p.name)}</th>`).join('')}<th class="num">Nota anual</th></tr></thead><tbody>${students().map(s=>`<tr><td>${esc(s.name)}</td>${periods().map(p=>`<td class="num">${fmt(periodResult(s.id,p.id)?.total)}</td>`).join('')}<td class="num"><strong>${fmt(annualResult(s.id))}</strong></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Ainda não existem alunos.</td></tr>'}</tbody></table></div>`:'<div class="empty">Adiciona a primeira turma para começar.</div>'}</section><section class="panel span4"><h2>Ações rápidas</h2><div class="stack"><button class="btn" onclick="editClass()">+ Nova turma</button><button class="btn" onclick="editStudent()">+ Novo aluno</button><button class="btn" onclick="editPeriod()">+ Novo período</button><button class="btn primary" onclick="editAssessment()">+ Nova avaliação</button></div><div class="divider"></div><p class="help">Cada período é avaliado de forma independente. As estrelas acrescentam um bónus à nota do período, até ao máximo de 20 valores.</p></section></div>`}
function classesPage(){return `<div class="panel"><div class="flex between"><h2>Turmas (${db.classes.length})</h2><button class="btn primary" onclick="editClass()">+ Nova turma</button></div><div class="tablewrap"><table><thead><tr><th>Turma</th><th>Ano letivo</th><th>Alunos</th><th>Períodos</th><th>Avaliações</th><th></th></tr></thead><tbody>${db.classes.map(c=>`<tr><td><strong>${esc(c.name)}</strong></td><td>${esc(c.schoolYear||'—')}</td><td>${db.students.filter(x=>x.classId===c.id).length}</td><td>${db.periods.filter(x=>x.classId===c.id).length}</td><td>${db.assessments.filter(x=>x.classId===c.id).length}</td><td class="right"><button class="btn small" onclick="setClass('${c.id}');setView('students')">Abrir</button> <button class="btn small" onclick="editClass('${c.id}')">Editar</button> <button class="btn danger small" onclick="removeClass('${c.id}')">Remover</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Sem turmas.</td></tr>'}</tbody></table></div></div>${classId?`<div style="height:16px"></div><div class="panel"><div class="flex between"><h2>Períodos / semestres de ${esc(by('classes',classId)?.name||'')}</h2><button class="btn primary" onclick="editPeriod()">+ Adicionar</button></div><table><thead><tr><th>Ordem</th><th>Nome</th><th>Avaliações</th><th></th></tr></thead><tbody>${periods().map(p=>`<tr><td>${p.order}</td><td>${esc(p.name)}</td><td>${assessments(p.id).length}</td><td class="right"><button class="btn small" onclick="editPeriod('${p.id}')">Editar</button> <button class="btn danger small" onclick="removePeriod('${p.id}')">Remover</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Define os períodos ou semestres desta turma.</td></tr>'}</tbody></table></div>`:''}`}
function studentsPage(){return wrap(`<section class="panel"><div class="flex between"><h2>Alunos (${students().length})</h2><button class="btn primary" onclick="editStudent()">+ Adicionar aluno</button></div><div class="tablewrap"><table><thead><tr><th>N.º</th><th>Nome</th><th>Identificador</th><th>Nota anual</th><th></th></tr></thead><tbody>${students().map(s=>`<tr><td>${esc(s.number||'—')}</td><td><strong>${esc(s.name)}</strong></td><td>${esc(s.code||'—')}</td><td>${fmt(annualResult(s.id))}</td><td class="right"><button class="btn small" onclick="editStudent('${s.id}')">Editar</button> <button class="btn danger small" onclick="removeStudent('${s.id}')">Remover</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Ainda não foram adicionados alunos.</td></tr>'}</tbody></table></div></section>`)}
function assessmentsPage(){return wrap(`<div class="panel"><div class="flex between"><h2>Avaliações de ${esc(by('periods',periodId)?.name||'—')}</h2><button class="btn primary" onclick="editAssessment()" ${!periodId?'disabled':''}>+ Nova avaliação</button></div><p class="hint">O peso é relativo às restantes avaliações do período; não é necessário que os pesos somem 100. Só avaliações com peso positivo entram na nota.</p><div class="tablewrap"><table><thead><tr><th>Nome</th><th>Tipo</th><th>Data</th><th>Perguntas</th><th>Cotação</th><th>Peso</th><th>Google Doc</th><th></th></tr></thead><tbody>${assessments().map(a=>{const qs=questions(a.id),sum=qs.reduce((n,q)=>n+Number(q.max),0);return `<tr><td><strong>${esc(a.name)}</strong></td><td><span class="chip ${a.type==='Questão de aula'?'gold':''}">${esc(a.type)}</span></td><td>${esc(a.date||'—')}</td><td>${qs.length}</td><td>${fmt(sum)} / 200</td><td>${fmt(a.weight)}</td><td>${a.docId?`<a class="link" href="https://docs.google.com/document/d/${encodeURIComponent(a.docId)}/edit" target="_blank" rel="noopener noreferrer">Abrir ↗</a>`:'—'}</td><td class="right"><button class="btn small" onclick="editAssessment('${a.id}')">Editar</button> <button class="btn small" onclick="assessmentId='${a.id}';setView('grades')">Corrigir</button> <button class="btn danger small" onclick="removeAssessment('${a.id}')">Remover</button></td></tr>`}).join('')||'<tr><td colspan="8" class="empty">Ainda não há avaliações neste período.</td></tr>'}</tbody></table></div></div>`)}
function gradesPage(){const a=by('assessments',assessmentId),qs=a?questions(a.id):[],domains=[...new Set(qs.map(q=>q.domain))];return wrap(`<section class="panel"><div class="flex between"><div><h2>Grelha de correção</h2><span class="hint">Os valores são guardados quando sais da célula. Uma pergunta por preencher conta como zero quando existem outras respostas.</span></div><div class="flex"><select class="inline" style="min-width:240px" onchange="assessmentId=this.value;render()">${assessments().map(x=>`<option value="${x.id}" ${x.id===assessmentId?'selected':''}>${esc(x.name)} · ${esc(x.type)}</option>`).join('')||'<option>Sem avaliações</option>'}</select><button class="btn" onclick="if(assessmentId)editAssessment(assessmentId)" ${!a?'disabled':''}>Editar perguntas</button></div></div>${a&&qs.length?`<div class="note">${esc(a.name)} · cotação total: <strong>${fmt(qs.reduce((n,q)=>n+Number(q.max),0))}/200</strong>. A classificação final da prova é normalizada para 0–200 pontos e convertida em 0–20 valores.</div><div class="tablewrap"><table class="scoregrid"><thead><tr><th>Aluno</th>${qs.map(q=>`<th class="num"><span title="${esc(q.domain)}">${esc(q.name)}</span><div class="hint">${fmt(q.max)} pts</div></th>`).join('')}<th class="num">Pontos</th><th class="num">/ 200</th><th class="num">/ 20</th>${domains.map(d=>`<th class="num domainhead">${esc(d)} %</th>`).join('')}</tr></thead><tbody>${students().map(s=>{const r=assessmentResult(a,s.id);return `<tr><td><strong>${esc(s.name)}</strong><div class="hint">${esc(s.number||'')}</div></td>${qs.map(q=>`<td><input aria-label="${esc(s.name)} · ${esc(q.name)}" type="number" min="0" max="${q.max}" step="0.01" value="${grade(a.id,s.id,q.id)??''}" onchange="setGrade('${a.id}','${s.id}','${q.id}',this)" /></td>`).join('')}<td class="num">${fmt(r?.earned)}</td><td class="num"><strong>${fmt(r?.score200)}</strong></td><td class="num">${fmt(r?.score20)}</td>${domains.map(d=>`<td class="num">${fmt(domainResult(a.id,s.id,d))}%</td>`).join('')}</tr>`}).join('')||`<tr><td colspan="${qs.length+4+domains.length}" class="empty">Adiciona alunos à turma.</td></tr>`}</tbody></table></div>`:a?'<div class="empty">Esta avaliação ainda não tem perguntas. Edita a avaliação para adicionar perguntas e cotações.</div>':'<div class="empty">Cria uma avaliação para começar a corrigir.</div>'}</section>`)}
function starsPage(){const p=by('periods',periodId);return wrap(`<section class="panel"><div class="flex between"><h2>Estrelas de participação · ${esc(p?.name||'')}</h2><span class="chip gold">★ Máximo ${fmt(db.settings.starMax)} · bónus até +${fmt(db.settings.starBonus)} valores</span></div><p class="hint">Cada clique em +★ cria um registo independente, com data e hora. As estrelas contam apenas para este período. É possível desfazer o registo mais recente.</p><div class="tablewrap"><table><thead><tr><th>Aluno</th><th>Estrelas neste período</th><th>Progresso</th><th class="num">Bónus</th><th>Ações</th></tr></thead><tbody>${students().map(s=>{const count=starCount(s.id,periodId);return `<tr><td><strong>${esc(s.name)}</strong></td><td><span style="color:#e7a21d;font-size:19px">★</span> <strong>${count}</strong></td><td style="min-width:140px"><div class="progress"><div style="width:${Math.min(100,100*count/Math.max(1,db.settings.starMax))}%"></div></div></td><td class="num"><span class="badgeplus">+${fmt(bonus(s.id,periodId))}</span></td><td><button class="btn small primary" onclick="addStar('${s.id}')">+ ★</button> <button class="btn small" onclick="undoStar('${s.id}')" ${count===0?'disabled':''}>Desfazer</button></td></tr>`}).join('')||'<tr><td colspan="5" class="empty">Sem alunos.</td></tr>'}</tbody></table></div></section><div style="height:16px"></div><section class="panel"><h2>Histórico de estrelas</h2><div class="tablewrap"><table><thead><tr><th>Quando</th><th>Aluno</th><th>Período</th><th>Estrelas</th><th>Observação</th><th></th></tr></thead><tbody>${db.stars.filter(x=>x.classId===classId&&x.periodId===periodId).sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,100).map(x=>`<tr><td>${new Date(x.createdAt).toLocaleString('pt-PT')}</td><td>${esc(by('students',x.studentId)?.name||'[removido]')}</td><td>${esc(p?.name)}</td><td>${x.count}</td><td>${esc(x.note||'—')}</td><td><button class="btn danger small" onclick="removeStar('${x.id}')">Remover</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Sem registos neste período.</td></tr>'}</tbody></table></div></section>`)}
function reportsPage(){const p=by('periods',periodId),ass=assessments(),domains=[...new Set(ass.flatMap(a=>questions(a.id).map(q=>q.domain)))];return wrap(`<div class="tablist"><button class="on">Notas e domínios</button></div><section class="panel"><div class="flex between"><h2>${esc(p?.name||'—')} · resultados individuais</h2><button class="btn" onclick="exportExcel()">↓ Exportar relatório</button></div><p class="hint">A média ponderada considera as avaliações com classificação e peso positivo. O bónus é aplicado no final; a nota máxima é 20. A nota anual utiliza as notas finais de cada período com resultados.</p><div class="tablewrap"><table><thead><tr><th>Aluno</th>${ass.map(a=>`<th class="num">${esc(a.name)} <span class="hint">(${fmt(a.weight)})</span></th>`).join('')}<th class="num">Base /20</th><th class="num">★</th><th class="num">Bónus</th><th class="num">Final /20</th><th class="num">Ano /20</th></tr></thead><tbody>${students().map(s=>{let r=periodResult(s.id,periodId);return `<tr><td><strong>${esc(s.name)}</strong></td>${ass.map(a=>`<td class="num">${fmt(assessmentResult(a,s.id)?.score20)}</td>`).join('')}<td class="num">${fmt(r?.base)}</td><td class="num">${starCount(s.id,periodId)}</td><td class="num">+${fmt(bonus(s.id,periodId))}</td><td class="num"><strong>${fmt(r?.total)}</strong></td><td class="num"><strong>${fmt(annualResult(s.id))}</strong></td></tr>`}).join('')||'<tr><td colspan="10" class="empty">Sem alunos.</td></tr>'}</tbody></table></div></section><div style="height:16px"></div><section class="panel"><h2>Resultados por domínio e por avaliação</h2>${ass.map(a=>{const ds=[...new Set(questions(a.id).map(q=>q.domain))];return `<h3>${esc(a.name)} <span class="tag">${esc(a.type)}</span></h3><div class="tablewrap"><table><thead><tr><th>Aluno</th>${ds.map(d=>`<th class="num">${esc(d)} (%)</th>`).join('')}<th class="num">Prova /200</th></tr></thead><tbody>${students().map(s=>`<tr><td>${esc(s.name)}</td>${ds.map(d=>`<td class="num">${fmt(domainResult(a.id,s.id,d))}</td>`).join('')}<td class="num">${fmt(assessmentResult(a,s.id)?.score200)}</td></tr>`).join('')||'<tr><td>Sem alunos</td></tr>'}</tbody></table></div><div class="divider"></div>`}).join('')||'<div class="empty">Sem avaliações.</div>'}</section>`)}
function settingsPage(){const s=db.settings;return `<div class="layout"><section class="panel span6"><h2>Regras globais de classificação</h2><div class="stack"><div class="field"><label>Cálculo da nota anual</label><select id="cfgMethod"><option value="average" ${s.yearMethod==='average'?'selected':''}>Média das notas dos períodos/semestres</option><option value="last" ${s.yearMethod==='last'?'selected':''}>Nota do último período/semestre com avaliação</option></select></div><div class="field"><label>Máximo de estrelas para bónus integral</label><input id="cfgMax" type="number" min="1" step="1" value="${s.starMax}"></div><div class="field"><label>Majoração máxima por período (valores, 0 a 20)</label><input id="cfgBonus" type="number" min="0" max="20" step="0.01" value="${s.starBonus}"></div><div class="note">Regra: bónus = min(estrelas, máximo) / máximo × majoração. Exemplo: 1 estrela de um máximo de 25 e majoração 1 → +0,04 valores.</div><button class="btn primary" onclick="saveSettings()">Guardar regras</button></div></section><section class="panel span6"><h2>Google Sheets · base de dados</h2><p class="help">A página guarda sempre uma cópia neste navegador. Para ligar à Google Sheets, cria credenciais OAuth para aplicação Web e ativa Google Sheets API e Google Drive API na Google Cloud Console.</p><div class="stack"><div class="field"><label>Google OAuth Client ID</label><input id="cfgClient" value="${esc(s.clientId)}" placeholder="...apps.googleusercontent.com"></div><div class="field"><label>ID da spreadsheet (vazio para criar uma nova)</label><input id="cfgSheet" value="${esc(s.spreadsheetId)}" placeholder="ID do URL do Google Sheets"></div><div class="flex"><button class="btn" onclick="saveGoogleSettings()">Guardar ligação</button><button class="btn" onclick="googleSignIn()">Iniciar sessão Google</button></div><span class="hint" id="googleState">${googleToken?'Sessão Google autorizada':'Google não ligado'}</span><div class="flex"><button class="btn" onclick="createSpreadsheet()">+ Criar spreadsheet</button><button class="btn primary" onclick="pushSheets()">↑ Enviar dados para Sheets</button><button class="btn" onclick="pullSheets()">↓ Importar de Sheets</button></div><p class="hint">Última sincronização: ${esc(s.lastSync||'nunca')}. A sincronização é manual: enviar substitui as tabelas remotas; importar substitui os dados locais, após confirmação. Faz uma cópia de segurança antes de importar.</p></div></section><section class="panel span6"><h2>Google Docs · documentos das avaliações</h2><p class="help">Associa um documento Google Docs a cada teste ou questão de aula. Depois de iniciares sessão Google, podes procurar os teus documentos e selecionar o adequado ao editar uma avaliação.</p><button class="btn" onclick="listDocs()">Procurar os meus Google Docs</button><div id="docsList" style="margin-top:12px"></div></section><section class="panel span6"><h2>Segurança e cópias de segurança</h2><p class="help">Usa a exportação JSON para guardar ou transferir todos os registos. O ficheiro Excel é um relatório exportado, não uma cópia reimportável da base.</p><div class="flex"><button class="btn primary" onclick="exportExcel()">↓ Exportar Excel</button><button class="btn" onclick="exportJSON()">↓ Cópia JSON</button><label class="btn" style="cursor:pointer">↑ Importar JSON <input type="file" accept=".json,application/json" hidden onchange="importJSON(this)"></label></div><div class="divider"></div><button class="btn danger" onclick="clearAll()">Apagar todos os dados locais</button><p class="hint">Os dados dos alunos são pessoais. Usa contas escolares autorizadas, controla a partilha da spreadsheet e evita computadores partilhados.</p></section></div>`}
function openModal(title,body,onSubmit){E('modalTitle').textContent=title;E('modalBody').innerHTML=body;modalSubmit=onSubmit;E('modal').showModal()}
function closeModal(){E('modal').close();modalSubmit=null}
E('modalForm').addEventListener('submit',ev=>{ev.preventDefault();try{if(modalSubmit?.(new FormData(ev.target))!==false){save();closeModal();render();toast('Alterações guardadas')}}catch(e){toast(e.message,true)}});
function field(label,name,value='',type='text',extra=''){return `<div class="field"><label>${esc(label)}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function editClass(id=''){const c=by('classes',id)||{};openModal(id?'Editar turma':'Nova turma',`<div class="formgrid">${field('Nome da turma','name',c.name||'','text','maxlength="100"')}${field('Ano letivo','schoolYear',c.schoolYear||'2026/2027','text','maxlength="30"')}</div>`,f=>{const name=f.get('name').trim();if(!name)throw Error('Indica o nome');if(id)Object.assign(c,{name,schoolYear:f.get('schoolYear')});else{let x={id:uid(),name,schoolYear:f.get('schoolYear')};db.classes.push(x);classId=x.id;periodId='';}})}
function editStudent(id=''){if(!classId){toast('Cria primeiro uma turma',true);return}const s=by('students',id)||{};openModal(id?'Editar aluno':'Adicionar aluno',`<div class="formgrid">${field('Nome completo','name',s.name||'')}${field('Número','number',s.number||'','text','maxlength="20"')}<div class="full">${field('Identificador interno (opcional)','code',s.code||'')}</div></div>`,f=>{const x={name:f.get('name').trim(),number:f.get('number').trim(),code:f.get('code').trim()};if(!x.name)throw Error('Nome obrigatório');if(id)Object.assign(s,x);else db.students.push({id:uid(),classId,...x})})}
function editPeriod(id=''){if(!classId){toast('Cria primeiro uma turma',true);return}const p=by('periods',id)||{},max=Math.max(0,...periods().map(x=>Number(x.order)||0));openModal(id?'Editar período':'Adicionar período / semestre',`<div class="formgrid">${field('Nome','name',p.name||'1.º semestre')}${field('Ordem cronológica','order',p.order||max+1,'number','min="1" step="1"')}</div>`,f=>{const x={name:f.get('name').trim(),order:Number(f.get('order'))};if(!x.name||x.order<1)throw Error('Dados inválidos');if(id)Object.assign(p,x);else{let a={id:uid(),classId,...x};db.periods.push(a);periodId=a.id}})}
function questionRows(){return draftQuestions.map((q,i)=>`<div class="formgrid" style="align-items:end;margin-bottom:9px" data-qi="${i}"><div class="field"><label>Pergunta</label><input class="qname" value="${esc(q.name)}" required></div><div class="field"><label>Domínio</label><input class="qdomain" value="${esc(q.domain)}" required></div><div class="field"><label>Cotação (pontos)</label><input class="qmax" type="number" min="0.01" max="200" step="0.01" value="${q.max}" required></div><div><button type="button" class="btn danger small" onclick="delQuestion(${i})">Remover pergunta</button></div></div>`).join('')}
function captureQuestions(){const rows=[...E('questionEditor').querySelectorAll('[data-qi]')];draftQuestions=rows.map((r,i)=>({id:draftQuestions[i]?.id||uid(),name:r.querySelector('.qname').value,domain:r.querySelector('.qdomain').value,max:r.querySelector('.qmax').value,order:i+1}))}
function addQuestion(){captureQuestions();draftQuestions.push({id:uid(),name:'P'+(draftQuestions.length+1),domain:'Domínio 1',max:10,order:draftQuestions.length+1});E('questionEditor').innerHTML=questionRows()}
function delQuestion(i){captureQuestions();draftQuestions.splice(i,1);E('questionEditor').innerHTML=questionRows()}
function editAssessment(id=''){if(!periodId){toast('Cria primeiro um período/semestre',true);return}const a=by('assessments',id)||{};draftQuestions=id?questions(id).map(x=>({...x})):[];openModal(id?'Editar avaliação':'Nova avaliação',`<div class="formgrid">${field('Nome','name',a.name||'Teste 1')}<div class="field"><label>Tipo</label><select name="type"><option ${a.type!=='Questão de aula'?'selected':''}>Teste</option><option ${a.type==='Questão de aula'?'selected':''}>Questão de aula</option></select></div>${field('Data','date',a.date||new Date().toISOString().slice(0,10),'date')}${field('Peso relativo no período','weight',a.weight??1,'number','min="0" step="0.01"')}<div class="full">${field('Google Docs · ID do documento (opcional)','docId',a.docId||'','text','placeholder="ID extraído de docs.google.com/document/d/ID/edit"')}</div></div><div class="divider"></div><div class="flex between"><h3>Perguntas e domínios</h3><button type="button" class="btn small" onclick="addQuestion()">+ Pergunta</button></div><div id="questionEditor">${questionRows()}</div><p class="hint">A soma das cotações deve ser 200 pontos. Os resultados de cada domínio usam apenas as perguntas atribuídas a esse domínio. Alterar ou remover perguntas já classificadas pode afetar resultados anteriores.</p>`,f=>{captureQuestions();const name=f.get('name').trim(),weight=Number(f.get('weight'));if(!name||weight<0||!Number.isFinite(weight))throw Error('Nome ou peso inválido');if(draftQuestions.some(q=>!q.name.trim()||!q.domain.trim()||Number(q.max)<=0||!Number.isFinite(Number(q.max))))throw Error('Verifica as perguntas');const total=draftQuestions.reduce((n,q)=>n+Number(q.max),0);if(draftQuestions.length&&Math.abs(total-200)>.001)throw Error(`A cotação deve somar 200 pontos (atualmente ${fmt(total)}).`);const x={name,type:f.get('type'),date:f.get('date'),weight,docId:f.get('docId').trim()};let aid=id;if(id)Object.assign(a,x);else{aid=uid();db.assessments.push({id:aid,classId,periodId,...x})}const previous=questions(aid).map(q=>q.id),current=new Set(draftQuestions.map(q=>q.id));db.questions=db.questions.filter(q=>q.assessmentId!==aid);db.questions.push(...draftQuestions.map((q,i)=>({id:q.id,assessmentId:aid,name:q.name.trim(),domain:q.domain.trim(),max:Number(q.max),order:i+1})));db.grades=db.grades.filter(g=>!previous.includes(g.questionId)||current.has(g.questionId));return true})}
function confirmDelete(txt){return confirm('Eliminar '+txt+'? Esta ação não pode ser desfeita. Faz uma cópia de segurança se necessário.')}
function removeClass(id){if(!confirmDelete('esta turma, alunos, avaliações, períodos e estrelas'))return;const ass=db.assessments.filter(x=>x.classId===id).map(x=>x.id),qs=db.questions.filter(x=>ass.includes(x.assessmentId)).map(x=>x.id);db.classes=db.classes.filter(x=>x.id!==id);for(const t of ['students','periods','assessments','stars'])db[t]=db[t].filter(x=>x.classId!==id);db.questions=db.questions.filter(x=>!ass.includes(x.assessmentId));db.grades=db.grades.filter(x=>!ass.includes(x.assessmentId)&&!qs.includes(x.questionId));save();render()}
function removeStudent(id){if(!confirmDelete('este aluno e todas as suas notas e estrelas'))return;db.students=db.students.filter(x=>x.id!==id);db.grades=db.grades.filter(x=>x.studentId!==id);db.stars=db.stars.filter(x=>x.studentId!==id);save();render()}
function removePeriod(id){if(!confirmDelete('este período e as avaliações, classificações e estrelas respetivas'))return;const ass=db.assessments.filter(x=>x.periodId===id).map(x=>x.id);db.periods=db.periods.filter(x=>x.id!==id);db.assessments=db.assessments.filter(x=>x.periodId!==id);db.questions=db.questions.filter(x=>!ass.includes(x.assessmentId));db.grades=db.grades.filter(x=>!ass.includes(x.assessmentId));db.stars=db.stars.filter(x=>x.periodId!==id);save();render()}
function removeAssessment(id){if(!confirmDelete('esta avaliação, perguntas e classificações'))return;db.assessments=db.assessments.filter(x=>x.id!==id);db.questions=db.questions.filter(x=>x.assessmentId!==id);db.grades=db.grades.filter(x=>x.assessmentId!==id);save();render()}
function setGrade(a,s,q,input){const question=by('questions',q),raw=input.value.trim();if(raw!==''&&(!Number.isFinite(Number(raw))||Number(raw)<0||Number(raw)>Number(question.max))){toast(`Classificação inválida: entre 0 e ${fmt(question.max)}`,true);input.value=grade(a,s,q)??'';return}db.grades=db.grades.filter(x=>!(x.assessmentId===a&&x.studentId===s&&x.questionId===q));if(raw!=='')db.grades.push({id:uid(),assessmentId:a,studentId:s,questionId:q,score:Number(raw)});save();render()}
function addStar(id){if(!periodId)return;db.stars.push({id:uid(),classId,periodId,studentId:id,count:1,note:'',createdAt:new Date().toISOString()});save();render()}
function undoStar(id){const logs=db.stars.filter(x=>x.studentId===id&&x.periodId===periodId).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));if(!logs.length)return;db.stars=db.stars.filter(x=>x.id!==logs[0].id);save();render()}
function removeStar(id){if(!confirm('Remover este registo de estrelas?'))return;db.stars=db.stars.filter(x=>x.id!==id);save();render()}
function saveSettings(){const a=Number(E('cfgMax').value),b=Number(E('cfgBonus').value);if(!Number.isInteger(a)||a<1||!Number.isFinite(b)||b<0||b>20){toast('Máximo de estrelas ou bónus inválido',true);return}Object.assign(db.settings,{yearMethod:E('cfgMethod').value,starMax:a,starBonus:b});save();render();toast('Regras globais guardadas')}
function saveGoogleSettings(){db.settings.clientId=E('cfgClient').value.trim();db.settings.spreadsheetId=E('cfgSheet').value.trim();googleToken='';tokenClient=null;save();render();toast('Configuração Google guardada')}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function exportJSON(){downloadBlob(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'atlas_copia_'+new Date().toISOString().slice(0,10)+'.json')}
async function importJSON(input){const file=input.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!data||!Array.isArray(data.classes)||!Array.isArray(data.grades)||!data.settings)throw Error('Ficheiro de dados inválido');if(!confirm('Substituir TODOS os dados locais pelos do ficheiro?'))return;db={...empty(),...data,settings:{...empty().settings,...data.settings}};save();classId='';periodId='';render();toast('Cópia de segurança importada')}catch(e){toast(e.message,true)}input.value=''}
function clearAll(){if(!confirm('Apagar TODOS os dados do navegador? Esta ação é irreversível.'))return;if(!confirm('Confirmas a eliminação definitiva dos dados locais?'))return;db=empty();classId='';periodId='';assessmentId='';save();render();toast('Dados locais eliminados')}
function excelSheets(){const rows=[];for(const c of db.classes){for(const s of db.students.filter(x=>x.classId===c.id)){const pr=db.periods.filter(x=>x.classId===c.id).sort((a,b)=>a.order-b.order);for(const p of pr){const r=periodResult(s.id,p.id);rows.push({Turma:c.name,'Ano letivo':c.schoolYear,Numero:s.number,Aluno:s.name,Periodo:p.name,'Nota base /20':r?.base??'','Estrelas':starCount(s.id,p.id),'Bonus /20':r?.bonus??bonus(s.id,p.id),'Nota final /20':r?.total??'','Nota anual /20':annualResult(s.id)??''})}}}const detailed=[];for(const a of db.assessments){const c=by('classes',a.classId),p=by('periods',a.periodId);for(const s of db.students.filter(x=>x.classId===a.classId)){const r=assessmentResult(a,s.id);detailed.push({Turma:c?.name||'',Periodo:p?.name||'',Aluno:s.name,Numero:s.number,Avaliacao:a.name,Tipo:a.type,Data:a.date,Peso:a.weight,'Pontos obtidos':r?.earned??'','Pontos possiveis':r?.total??'','Classificacao /200':r?.score200??'','Classificacao /20':r?.score20??'',Corrigidas:r?.filled??0,'Total de perguntas':questions(a.id).length})}}const domains=[];for(const a of db.assessments){const ds=[...new Set(questions(a.id).map(q=>q.domain))];for(const s of db.students.filter(x=>x.classId===a.classId))for(const d of ds)domains.push({Turma:by('classes',a.classId)?.name||'',Periodo:by('periods',a.periodId)?.name||'',Avaliacao:a.name,Aluno:s.name,Dominio:d,'Resultado %':domainResult(a.id,s.id,d)??''})}const pointRows=[];for(const a of db.assessments)for(const s of db.students.filter(x=>x.classId===a.classId))for(const q of questions(a.id))pointRows.push({Turma:by('classes',a.classId)?.name||'',Periodo:by('periods',a.periodId)?.name||'',Aluno:s.name,Avaliacao:a.name,Pergunta:q.name,Dominio:q.domain,'Cotacao':q.max,'Pontos':grade(a.id,s.id,q.id)??''});return {'Resumo de notas':rows,'Avaliacoes':detailed,'Dominios':domains,'Perguntas e notas':pointRows,'Turmas':db.classes,'Alunos':db.students,'Periodos':db.periods,'Configuracao':[{'Metodo anual':db.settings.yearMethod==='average'?'Média dos períodos':'Último período','Max estrelas':db.settings.starMax,'Bonus max /20':db.settings.starBonus}]}}
function exportExcel(){if(typeof XLSX==='undefined'){toast('A biblioteca Excel não carregou. Liga-te à internet e volta a tentar.',true);return}const wb=XLSX.utils.book_new();for(const [name,rows] of Object.entries(excelSheets())){const sheet=XLSX.utils.json_to_sheet(rows.length?rows:[{Info:'Sem dados'}]);sheet['!cols']=Object.keys(rows[0]||{Info:''}).map(k=>({wch:Math.min(38,Math.max(13,k.length+4))}));XLSX.utils.book_append_sheet(wb,sheet,name.slice(0,31))}XLSX.writeFile(wb,'atlas_avaliacao_'+new Date().toISOString().slice(0,10)+'.xlsx');toast('Excel exportado com folhas organizadas')}
// Google OAuth via GIS + Google Sheets REST. All sync actions are explicit.
const SCOPES='https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.metadata.readonly';
function googleSignIn(){const cid=db.settings.clientId;if(!cid){toast('Guarda primeiro o Client ID OAuth nas definições',true);return}if(!window.google?.accounts?.oauth2){toast('O serviço de autenticação Google não carregou. Verifica a ligação à internet.',true);return}tokenClient=google.accounts.oauth2.initTokenClient({client_id:cid,scope:SCOPES,callback:response=>{if(response.error){toast('Autorização Google falhou: '+response.error,true);return}googleToken=response.access_token;toast('Conta Google autorizada');if(view==='settings')render()}});tokenClient.requestAccessToken({prompt:'consent'})}
async function apiGoogle(url,options={}){if(!googleToken)throw Error('Inicia sessão Google antes de sincronizar');const resp=await fetch(url,{...options,headers:{Authorization:'Bearer '+googleToken,'Content-Type':'application/json',...(options.headers||{})}});let data;try{data=await resp.json()}catch{data={}}if(!resp.ok)throw Error(data.error?.message||`Google API: erro ${resp.status}`);return data}
async function createSpreadsheet(){if(!googleToken){toast('Inicia sessão Google primeiro',true);return}try{const data=await apiGoogle('https://sheets.googleapis.com/v4/spreadsheets',{method:'POST',body:JSON.stringify({properties:{title:'Atlas - Base de dados Avaliação Somativa'}})});db.settings.spreadsheetId=data.spreadsheetId;save();render();toast('Spreadsheet criada. Agora clica em Enviar dados para Sheets.');window.open(data.spreadsheetUrl,'_blank','noopener')}catch(e){toast(e.message,true)}}
const TABNAMES={classes:'Turmas',students:'Alunos',periods:'Periodos',assessments:'Avaliacoes',questions:'Perguntas',grades:'Classificacoes',stars:'Estrelas'};
async function ensureTabs(id){const url='https://sheets.googleapis.com/v4/spreadsheets/'+encodeURIComponent(id);const obj=await apiGoogle(url+'?fields=sheets.properties');const names=new Set((obj.sheets||[]).map(x=>x.properties.title));const needed=['Atlas_Config',...Object.values(TABNAMES)].filter(x=>!names.has(x));if(needed.length)await apiGoogle(url+':batchUpdate',{method:'POST',body:JSON.stringify({requests:needed.map(title=>({addSheet:{properties:{title}}}))})})}
async function pushSheets(){const id=db.settings.spreadsheetId;if(!id){toast('Indica ou cria uma spreadsheet nas definições',true);return}if(!googleToken){toast('Inicia sessão Google primeiro',true);return}if(!confirm('Enviar todos os dados locais para a spreadsheet? Isto substitui os dados nas tabelas Atlas da spreadsheet.'))return;try{await ensureTabs(id);const base='https://sheets.googleapis.com/v4/spreadsheets/'+encodeURIComponent(id)+'/values';const ranges=["'Atlas_Config'!A1:B2",...Object.values(TABNAMES).map(n=>`'${n}'!A1:B10000`)];await apiGoogle(base+':batchClear',{method:'POST',body:JSON.stringify({ranges})});const data=[{range:"'Atlas_Config'!A1:B2",values:[['key','json'],['settings',JSON.stringify({...db.settings,clientId:'',spreadsheetId:'',lastSync:''})]]},...Object.entries(TABNAMES).map(([key,tab])=>({range:`'${tab}'!A1:B${Math.max(2,db[key].length+1)}`,values:[['id','json'],...db[key].map(x=>[x.id,JSON.stringify(x)])]}))];await apiGoogle(base+':batchUpdate',{method:'POST',body:JSON.stringify({valueInputOption:'RAW',data})});db.settings.lastSync=new Date().toLocaleString('pt-PT');save();render();toast('Dados enviados com sucesso para Google Sheets')}catch(e){toast('Erro ao enviar: '+e.message,true)}}
async function pullSheets(){const id=db.settings.spreadsheetId;if(!id||!googleToken){toast('Configura a spreadsheet e inicia sessão Google',true);return}if(!confirm('IMPORTANTE: os dados da Google Sheets irão SUBSTITUIR os dados deste navegador. Recomenda-se exportar uma cópia JSON antes de continuar.'))return;try{const uri='https://sheets.googleapis.com/v4/spreadsheets/'+encodeURIComponent(id)+'/values:batchGet?'+['Atlas_Config!A1:B100',...Object.values(TABNAMES).map(n=>n+'!A1:B10000')].map(r=>'ranges='+encodeURIComponent(r)).join('&');const out=await apiGoogle(uri);const rs=out.valueRanges||[];const cfg=JSON.parse(rs[0]?.values?.[1]?.[1]||'{}');const next=empty();next.settings={...db.settings,...cfg,clientId:db.settings.clientId,spreadsheetId:id,lastSync:new Date().toLocaleString('pt-PT')};Object.keys(TABNAMES).forEach((key,i)=>{next[key]=(rs[i+1]?.values||[]).slice(1).filter(row=>row[1]).map(row=>JSON.parse(row[1]))});db=next;classId='';periodId='';assessmentId='';save();render();toast('Dados importados de Google Sheets')}catch(e){toast('Erro ao importar: '+e.message,true)}}
async function listDocs(){if(!googleToken){toast('Inicia sessão Google primeiro',true);return}try{const x=await apiGoogle('https://www.googleapis.com/drive/v3/files?'+new URLSearchParams({q:"mimeType = 'application/vnd.google-apps.document' and trashed = false",fields:'nextPageToken,files(id,name,webViewLink,modifiedTime)',page_size:'50',orderBy:'modifiedTime desc'}));docItems=x.files||[];E('docsList').innerHTML=docItems.length?docItems.map(d=>`<div class="docitem"><div><strong>${esc(d.name)}</strong><div class="hint">${esc(new Date(d.modifiedTime).toLocaleDateString('pt-PT'))} · ${esc(d.id)}</div></div><div class="flex"><button class="btn small" onclick="navigator.clipboard.writeText('${esc(d.id)}');toast('ID copiado')">Copiar ID</button><a class="link" href="https://docs.google.com/document/d/${encodeURIComponent(d.id)}/edit" target="_blank" rel="noopener">Abrir ↗</a></div></div>`).join(''):'<div class="empty">Não foram encontrados documentos.</div>'}catch(e){toast(e.message,true)}}
save();render();
</script>
